<title>Write The Vision</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A gamified vision board built on Be → Do → Have, with scripture as the mainframe and behavioural neuroscience as the mechanics.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d14">
<style>/* ACHIEVE — Write The Vision
   A committed dark interface: lamplight on dark ground. Gold is manna, fire,
   and the lamp; deep ink is the ground you have not taken yet. */

:root {
  --ink: #0b0d14;
  --ink-2: #12151f;
  --ink-3: #1a1e2b;
  --ink-4: #232838;
  --line: #2c3244;
  --line-soft: #232838;

  --text: #e8e6e0;
  --text-2: #a8a99c;
  --text-3: #6f7284;

  --gold: #e0b054;
  --gold-2: #c9973c;
  --gold-dim: #6b5527;
  --flame: #e2703a;
  --olive: #7d9a6a;
  --water: #5b8fb0;
  --blood: #a8484a;
  --violet: #8a76b8;

  --ok: #7d9a6a;
  --warn: #d19a44;
  --bad: #b3565a;

  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 18px;

  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  --glow: 0 0 24px rgba(224, 176, 84, .18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224, 176, 84, .07), transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(138, 118, 184, .05), transparent 70%);
  background-attachment: fixed;
  min-height: 100vh;
}

h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.2; font-weight: 600; }
h1 { font-size: 1.6rem; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 .8em; }
a { color: var(--gold); }
button, input, textarea, select { font: inherit; color: inherit; }

/* ── layout ─────────────────────────────────────────────────────────── */

.app {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 16px 120px;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0 10px;
  background: linear-gradient(to bottom, var(--ink) 60%, transparent);
  backdrop-filter: blur(6px);
}

.brand {
  display: flex; align-items: baseline; gap: 9px;
  font-family: var(--serif);
  letter-spacing: .16em;
  text-transform: uppercase;
  font-size: .82rem;
  color: var(--gold);
  white-space: nowrap;
}
.brand small {
  font-family: var(--sans);
  letter-spacing: .04em;
  text-transform: none;
  color: var(--text-3);
  font-size: .72rem;
}

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.hud {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.hud-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--ink-2);
  font-size: .74rem;
  color: var(--text-2);
  white-space: nowrap;
}
.hud-chip b { color: var(--text); font-weight: 600; }
.hud-chip.gold { border-color: var(--gold-dim); color: var(--gold); }
.hud-chip.gold b { color: var(--gold); }

/* ── nav ────────────────────────────────────────────────────────────── */

.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
  display: flex; justify-content: center; gap: 2px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: rgba(11, 13, 20, .93);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
  overflow-x: auto;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }

.nav button {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: 62px; padding: 7px 8px 5px;
  background: none; border: 0; border-radius: var(--radius-sm);
  color: var(--text-3); cursor: pointer;
  font-size: .66rem; letter-spacing: .03em;
  transition: color .15s, background .15s;
}
.nav button .ico { font-size: 1.06rem; line-height: 1; filter: grayscale(1) opacity(.65); transition: filter .15s; }
.nav button:hover { color: var(--text-2); background: var(--ink-2); }
.nav button[aria-current='true'] { color: var(--gold); background: var(--ink-3); }
.nav button[aria-current='true'] .ico { filter: none; }
.nav button .dot {
  position: absolute; margin-left: 30px; margin-top: -2px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--flame);
}

/* ── cards ──────────────────────────────────────────────────────────── */

.card {
  background: var(--ink-2);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.card.tight { padding: 12px 14px; }
.card.raised { box-shadow: var(--shadow); }
.card-head {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 10px;
}
.card-head h2, .card-head h3 { margin: 0; }
.card-head .spacer { margin-left: auto; }

.eyebrow {
  font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 6px; font-weight: 600;
}

/* ── the step (hero) ────────────────────────────────────────────────── */

.step {
  position: relative;
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-lg);
  padding: 22px;
  background:
    linear-gradient(160deg, rgba(224, 176, 84, .10), transparent 55%),
    var(--ink-2);
  box-shadow: var(--glow);
  overflow: hidden;
}
.step::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 80% at 8% 0%, rgba(224, 176, 84, .13), transparent 60%);
  pointer-events: none;
}
.step.tone-rest { border-color: #2f4257; background: linear-gradient(160deg, rgba(91, 143, 176, .10), transparent 55%), var(--ink-2); box-shadow: none; }
.step.tone-mercy { border-color: #4a3a5e; background: linear-gradient(160deg, rgba(138, 118, 184, .12), transparent 55%), var(--ink-2); box-shadow: none; }
.step.tone-gate { border-color: #5c4030; background: linear-gradient(160deg, rgba(226, 112, 58, .10), transparent 55%), var(--ink-2); box-shadow: none; }
.step.tone-nearing { border-color: var(--gold); box-shadow: 0 0 34px rgba(224, 176, 84, .26); }

.step h1 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: .35em; position: relative; }
.step .step-body { color: var(--text-2); position: relative; margin-bottom: 14px; }
.step .step-quest {
  font-family: var(--serif); font-size: 1.12rem; color: var(--text);
  padding: 12px 14px; border-left: 3px solid var(--gold);
  background: rgba(0, 0, 0, .22); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin-bottom: 14px; position: relative;
}

/* ── scripture ──────────────────────────────────────────────────────── */

.verse {
  font-family: var(--serif);
  border-left: 2px solid var(--gold-dim);
  padding: 2px 0 2px 14px;
  margin: 12px 0;
  color: #ddd6c4;
  font-size: 1.02rem;
  line-height: 1.6;
  position: relative;
}
.verse .ref {
  display: block; margin-top: 6px;
  font-family: var(--sans); font-size: .74rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--gold-2);
}
.verse .note {
  display: block; margin-top: 8px;
  font-family: var(--sans); font-size: .82rem; color: var(--text-3);
  font-style: italic; line-height: 1.5;
}
.verse.sm { font-size: .92rem; }

/* ── the mechanism note ─────────────────────────────────────────────── */

.why {
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: rgba(0, 0, 0, .2);
  padding: 11px 13px;
  margin: 12px 0 0;
  position: relative;
}
.why .why-head {
  display: flex; align-items: center; gap: 7px;
  font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--water); font-weight: 600; margin-bottom: 5px;
}
.why .why-body { font-size: .86rem; color: var(--text-2); line-height: 1.55; }
.why .why-cite {
  display: block; margin-top: 7px;
  font-size: .73rem; color: var(--text-3); font-family: var(--mono);
  word-break: break-word;
}
.why details summary { cursor: pointer; color: var(--water); font-size: .8rem; }

/* ── buttons ────────────────────────────────────────────────────────── */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--ink-3);
  color: var(--text);
  cursor: pointer;
  font-size: .9rem; font-weight: 500;
  transition: background .15s, border-color .15s, transform .06s;
  text-decoration: none;
}
.btn:hover { background: var(--ink-4); border-color: var(--text-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary {
  background: linear-gradient(180deg, var(--gold), var(--gold-2));
  border-color: var(--gold-2); color: #22190a; font-weight: 650;
}
.btn.primary:hover { background: linear-gradient(180deg, #eec066, var(--gold)); }
.btn.ghost { background: none; }
.btn.sm { padding: 6px 12px; font-size: .8rem; }
.btn.danger { color: var(--bad); border-color: #4a2b2d; }
.btn.danger:hover { background: #2a1618; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ── forms ──────────────────────────────────────────────────────────── */

.field { margin-bottom: 13px; }
.field > label {
  display: block; margin-bottom: 5px;
  font-size: .78rem; font-weight: 600; letter-spacing: .04em; color: var(--text-2);
}
.field .hint { font-size: .76rem; color: var(--text-3); margin-top: 5px; line-height: 1.5; }

input[type='text'], input[type='url'], input[type='password'], input[type='number'], textarea, select {
  width: 100%;
  padding: 10px 12px;
  background: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--gold-dim);
  box-shadow: 0 0 0 3px rgba(224, 176, 84, .12);
}
textarea { resize: vertical; min-height: 74px; line-height: 1.55; }
input::placeholder, textarea::placeholder { color: #4e5164; }

.err {
  display: block; margin-top: 6px; padding: 8px 10px;
  background: rgba(179, 86, 90, .1); border-left: 2px solid var(--bad);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: .82rem; color: #e2a9ab;
}
.err .err-help { display: block; margin-top: 4px; color: var(--text-3); font-size: .76rem; font-style: italic; }
.ok-msg {
  padding: 8px 10px; background: rgba(125, 154, 106, .1);
  border-left: 2px solid var(--ok); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: .84rem; color: #b6cba6;
}

/* ── grids and lists ────────────────────────────────────────────────── */

.grid { display: grid; gap: 12px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.grid.three { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

.stat { text-align: center; padding: 12px 8px; background: var(--ink-2); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); }
.stat .n { font-size: 1.5rem; font-weight: 650; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: .7rem; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }

.row {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; }
.row .s { font-size: .79rem; color: var(--text-3); }

.empty {
  text-align: center; padding: 30px 18px; color: var(--text-3);
  border: 1px dashed var(--line); border-radius: var(--radius);
}
.empty .big { font-size: 1.7rem; margin-bottom: 8px; opacity: .5; }

/* ── progress ───────────────────────────────────────────────────────── */

.bar { height: 6px; background: var(--ink-4); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-2), var(--gold)); border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.thin { height: 4px; }
.bar.olive > i { background: linear-gradient(90deg, #5c7a4c, var(--olive)); }

/* ── stones / vision board ──────────────────────────────────────────── */

.board-wrap { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--ink); }
.board-wrap img { display: block; width: 100%; height: auto; }
.board-wrap.picking { cursor: crosshair; }
.board-wrap.picking::after {
  content: 'Tap a thing on your board to set a Stone';
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  background: rgba(0,0,0,.8); color: var(--gold); padding: 6px 13px;
  border-radius: 999px; font-size: .76rem; white-space: nowrap; pointer-events: none;
  border: 1px solid var(--gold-dim);
}

.pin {
  position: absolute; transform: translate(-50%, -50%);
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(224, 176, 84, .9); border: 2px solid #22190a;
  color: #22190a; font-size: .72rem; font-weight: 700;
  display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 0 0 4px rgba(224,176,84,.2), 0 2px 8px rgba(0,0,0,.6);
  transition: transform .15s;
}
.pin:hover { transform: translate(-50%, -50%) scale(1.18); }
.pin.veiled { background: #4a4d5e; color: #9a9db0; box-shadow: 0 0 0 4px rgba(74,77,94,.2); }
.pin.done { background: var(--olive); color: #14200e; }

.stone {
  border: 1px solid var(--line-soft); border-radius: var(--radius);
  background: var(--ink-2); padding: 13px; position: relative; overflow: hidden;
}
.stone.veiled { border-style: dashed; opacity: .82; }
.stone.veiled .stone-title { color: var(--text-2); }
.stone .stone-title { font-family: var(--serif); font-size: 1.05rem; margin-bottom: 4px; }
.stone .stone-dom { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.stone .stone-thumb { width: 100%; height: 92px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 9px; border: 1px solid var(--line-soft); }
.veil-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .7rem; color: var(--flame); border: 1px solid #5c4030;
  padding: 2px 8px; border-radius: 999px; margin-top: 8px;
}

/* ── maps ───────────────────────────────────────────────────────────── */

.map-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.map-tabs button {
  padding: 7px 14px; border: 1px solid var(--line); background: var(--ink-2);
  border-radius: 999px; color: var(--text-2); cursor: pointer; font-size: .82rem;
}
.map-tabs button[aria-pressed='true'] { background: var(--ink-4); color: var(--gold); border-color: var(--gold-dim); }

.canvas-wrap { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #080a10; }
.canvas-wrap canvas { display: block; width: 100%; height: auto; }
.map-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: .76rem; color: var(--text-3); }
.map-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

/* ── chart ──────────────────────────────────────────────────────────── */

.chart-wrap { position: relative; }
/* Canvases are drawn at a fixed backing size, so they MUST be told to scale
   down or they overflow the viewport on a phone. */
.chart-wrap canvas, .canvas-wrap canvas { display: block; width: 100%; height: auto; max-width: 100%; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 0; font-size: .8rem; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.chart-legend i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }

/* ── chat ───────────────────────────────────────────────────────────── */

.chat { display: flex; flex-direction: column; gap: 9px; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
.msg { display: flex; gap: 9px; align-items: flex-start; }
.msg .who {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; font-size: .74rem; font-weight: 700;
  background: var(--ink-4); color: var(--gold); border: 1px solid var(--line);
}
.msg .bub { background: var(--ink-3); border-radius: 3px 11px 11px 11px; padding: 8px 11px; max-width: 78%; }
.msg .nm { font-size: .72rem; color: var(--gold-2); margin-bottom: 2px; font-weight: 600; }
.msg .bd { font-size: .9rem; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg .tm { font-size: .66rem; color: var(--text-3); margin-top: 3px; }
.msg.mine { flex-direction: row-reverse; }
.msg.mine .bub { background: #2b2416; border-radius: 11px 3px 11px 11px; }
.msg.mine .nm { text-align: right; }
.msg.system { justify-content: center; }
.msg.system .bub { background: none; border: 1px dashed var(--line); color: var(--text-3); font-size: .8rem; text-align: center; max-width: 92%; }

.chat-form { display: flex; gap: 8px; margin-top: 11px; }
.chat-form input { flex: 1; }

.member {
  display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.member:last-child { border-bottom: 0; }

/* ── timeline / recap ───────────────────────────────────────────────── */

.timeline { position: relative; padding-left: 22px; }
.timeline::before {
  content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
  width: 2px; background: linear-gradient(to bottom, var(--gold-dim), var(--line), transparent);
}
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item::before {
  content: ''; position: absolute; left: -20px; top: 6px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 3px var(--ink);
}
.tl-item.dim::before { background: var(--line); }
.tl-item .tl-when { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.tl-item .tl-what { font-weight: 500; }
.tl-item .tl-ref { font-size: .74rem; color: var(--gold-2); font-family: var(--serif); }

/* ── modal ──────────────────────────────────────────────────────────── */

.modal-bg {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(4, 5, 9, .82); backdrop-filter: blur(5px);
  display: grid; place-items: center; padding: 18px;
  overflow-y: auto;
}
.modal {
  background: var(--ink-2); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 22px;
  max-width: 560px; width: 100%; box-shadow: var(--shadow);
  max-height: 92vh; overflow-y: auto;
  margin: auto;
}
.modal h2 { font-family: var(--serif); }
.modal-close { position: absolute; top: 14px; right: 16px; }

/* ── focus timer ────────────────────────────────────────────────────── */

.timer { text-align: center; padding: 18px 0; }
.timer .clock {
  font-family: var(--mono); font-size: 3.2rem; font-weight: 600;
  color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1;
  letter-spacing: -.02em;
}
.timer .phase { font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-3); margin-top: 7px; }
.timer.resting .clock { color: var(--water); }

.ring { width: 168px; height: 168px; margin: 0 auto 6px; position: relative; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .ring-mid { position: absolute; inset: 0; display: grid; place-items: center; }

/* ── manna ──────────────────────────────────────────────────────────── */

@keyframes mannaIn {
  0% { opacity: 0; transform: translateY(-14px) scale(.86); }
  55% { opacity: 1; transform: translateY(3px) scale(1.05); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.manna {
  animation: mannaIn .55s cubic-bezier(.2,.9,.3,1.2);
  border: 1px solid var(--gold); background: linear-gradient(160deg, rgba(224,176,84,.2), transparent);
  border-radius: var(--radius); padding: 14px; text-align: center;
  box-shadow: var(--glow);
}
.manna .m-title { font-family: var(--serif); font-size: 1.16rem; color: var(--gold); }

/* ── misc ───────────────────────────────────────────────────────────── */

.pill {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: .7rem; border: 1px solid var(--line); color: var(--text-2);
  background: var(--ink-3);
}
.pill.gold { border-color: var(--gold-dim); color: var(--gold); }
.pill.olive { border-color: #3d5231; color: var(--olive); }
.pill.violet { border-color: #4a3a5e; color: var(--violet); }

.sep { height: 1px; background: var(--line-soft); margin: 16px 0; border: 0; }

function hashStr(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

/** Mulberry32 — tiny seeded PRNG so tests are deterministic. */
function seededRandom(seed) {
  let a = seed >>> 0;
  return function next() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

/** Local-calendar day key, e.g. "2026-08-12". Local, not UTC — days are lived locally. */
function dayKey(date = new Date()) {

  return `${y}-${m}-${day}`;
}

function parseDayKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);

/** Every distinct moment tag present in the bank. */
const MOMENTS = [...new Set(SCRIPTURE.flatMap((v) => v.moments))].sort();

/**
 * Pick a verse for a moment. Deterministic given a seed so the same day
 * yields the same word (a person should be able to sit with one verse),
 * but rotates across days so it never goes stale.
 */
function verseFor(moment, seed = 0) {
  const pool = SCRIPTURE.filter((v) => v.moments.includes(moment));
  if (!pool.length) return null;
  const idx = Math.abs(Math.floor(seed)) % pool.length;
  return pool[idx];
}

/** All verses matching any of the given moments, highest specificity first. */
function versesFor(moments) {
  const wanted = Array.isArray(moments) ? moments : [moments];
  return SCRIPTURE.map((v) => ({
    verse: v,
    hits: v.moments.filter((m) => wanted.includes(m)).length,
  }))
    .filter((x) => x.hits > 0)
    .sort((a, b) => b.hits - a.hits)
    .map((x) => x.verse);
}

function verseByRef(ref) {
  return SCRIPTURE.find((v) => v.ref === ref) || null;
}

/**
 * state.js — the model, and the rules that guard it.
 *
 * One hard architectural rule lives in this file:
 *
 *   THE WHY VAULT IS NEVER PART OF THE SHAREABLE STATE.
 *
 * It is not a flag on a record, it is a separate object under a separate
 * storage key, and `shareable()` is the only thing sync is ever handed. A
 * privacy promise enforced by a boolean is one refactor away from being
 * broken; one enforced by structure is not.
 *
 *   "…pray to thy Father which is in secret; and thy Father which seeth in
 *    secret shall reward thee openly."  — Matthew 6:6
 */

const SCHEMA_VERSION = 1;

/** The six territories of the Promised Land map. */
const DOMAINS = [
  { key: 'body', name: 'Body', ref: '1 Corinthians 9:27', line: 'I keep under my body, and bring it into subjection.', hue: 8 },
  { key: 'provision', name: 'Provision', ref: 'Deuteronomy 8:18', line: 'He giveth thee power to get wealth.', hue: 42 },
  { key: 'household', name: 'Household', ref: 'Joshua 24:15', line: 'As for me and my house, we will serve the LORD.', hue: 152 },
  { key: 'assignment', name: 'Assignment', ref: 'Esther 4:14', line: 'For such a time as this.', hue: 262 },
  { key: 'craft', name: 'Craft', ref: 'Proverbs 22:29', line: 'A man diligent in his business shall stand before kings.', hue: 200 },
  { key: 'communion', name: 'Communion', ref: 'John 15:5', line: 'He that abideth in me bringeth forth much fruit.', hue: 320 },
];

function domain(key) {
  return DOMAINS.find((d) => d.key === key) || DOMAINS[0];
}

/** A fresh, empty game. */
function emptyState() {
  return {
    version: SCHEMA_VERSION,
    player: {
      id: uid('plr'),
      name: '',
      newName: '',
      archetype: null,
      createdAt: Date.now(),
    },
    identities: [],
    boards: [],
    stones: [],
    quests: [],
    votes: [],
    pings: [],
    focusBlocks: [],
    manna: [],
    chronicle: [],
    letters: [],
    circle: { code: null, joinedAt: null, members: [], messages: [] },
    settings: {
      sabbathEnabled: true,
      sabbathDay: 0,          // Sunday
      difficultyLevel: 2,
      syncMode: 'local',      // 'local' | 'supabase'
      supabaseUrl: '',
      supabaseKey: '',
      displayName: '',
    },
    meta: {
      lastOpen: null,
      onboarded: false,
      seenPillars: false,
    },
  };
}

/** The Why Vault. Separate object, separate key, never handed to sync. */
function emptyVault() {
  return { version: SCHEMA_VERSION, entries: {}, updatedAt: null };
}

/**
 * Produce the ONLY object sync is ever allowed to see.
 *
 * Note what is absent: the vault is not passed in, so it cannot leak. Board
 * images are stripped too — they are large and personal, and the Circle sees
 * progress, not your private collage.
 */
function shareable(state) {
  return {
    version: state.version,
    player: {
      id: state.player.id,
      name: state.player.name,
      newName: state.player.newName,
      archetype: state.player.archetype,
    },
    // Identity statements are shareable; the WHY behind them is not.
    identities: state.identities.map((i) => ({
      id: i.id, statement: i.statement, domain: i.domain, createdAt: i.createdAt,
    })),
    stones: state.stones.map((s) => ({
      id: s.id, title: s.title, domain: s.domain, identityId: s.identityId,
      woopComplete: s.woopComplete, createdAt: s.createdAt, completedAt: s.completedAt,
    })),
    quests: state.quests.map((q) => ({
      id: q.id, stoneId: q.stoneId, identityId: q.identityId,
      text: q.sealed ? q.text : null,      // unsealed quests stay private
      sealed: Boolean(q.sealed), level: q.level,
      createdAt: q.createdAt, completedAt: q.completedAt,
    })),
    votes: state.votes.map((v) => ({ id: v.id, identityId: v.identityId, day: v.day, for: v.for })),
    stats: summarize(state),
  };
}

/** Compact public snapshot used by the Circle roster and the recap. */
function summarize(state) {
  const completed = state.quests.filter((q) => q.completedAt);
  const days = new Set(completed.map((q) => dayKey(new Date(q.completedAt))));
  return {
    steps: completed.length,
    stones: state.stones.length,
    stonesComplete: state.stones.filter((s) => s.completedAt).length,
    identities: state.identities.length,
    activeDays: days.size,
    focusMinutes: state.focusBlocks.reduce((a, b) => a + (b.minutes || 0), 0),
    since: state.player.createdAt,
  };
}

// ── migrations ────────────────────────────────────────────────────────────

/** Bring any older saved state up to the current schema, non-destructively. */
function migrate(raw) {
  if (!raw || typeof raw !== 'object') return emptyState();
  const base = emptyState();
  const out = {
    ...base,
    ...raw,
    player: { ...base.player, ...(raw.player || {}) },
    settings: { ...base.settings, ...(raw.settings || {}) },
    meta: { ...base.meta, ...(raw.meta || {}) },
    circle: { ...base.circle, ...(raw.circle || {}) },
  };
  // Arrays must be arrays even if a save was truncated or hand-edited.
  for (const k of ['identities', 'boards', 'stones', 'quests', 'votes', 'pings', 'focusBlocks', 'manna', 'chronicle', 'letters']) {
    if (!Array.isArray(out[k])) out[k] = [];
  }
  if (!Array.isArray(out.circle.members)) out.circle.members = [];
  if (!Array.isArray(out.circle.messages)) out.circle.messages = [];
  out.version = SCHEMA_VERSION;
  return out;
}

/**
 * The Chronicle — "after each, notes of what was accomplished."
 * Amabile & Kramer (2011): progress in meaningful work is the strongest
 * driver of inner work life, and NOTICING it is part of the effect.
 * Nothing in this game completes silently.
 */
function chronicle(state, { kind, title, body, refs, meta }) {

    ts: Date.now(),

/**
 * identity.js — BE > DO > HAVE.
 *
 * The world runs HAVE → DO → BE: "when I HAVE the money, I'll DO the things,
 * and then I'll BE free." That order never arrives, because the HAVE is the
 * gate and the gate never opens.
 *
 * Scripture runs it backwards, and so does the evidence:
 *
 *   BE   — God renames Abram "father of many nations" while he is childless
 *          (Gen 17:5), and calls Gideon "thou mighty man of valour" while he
 *          is hiding in a winepress (Judg 6:12). The name comes FIRST.
 *          "…calleth those things which be not as though they were." Rom 4:17
 *
 *   DO   — you then act from the name. Bem (1972) showed the self is INFERRED
 *          from observed behaviour, so every act is a vote you cast and then
 *          witness yourself casting. "Faith without works is dead." Jas 2:17
 *
 *   HAVE — the result is added, not chased. Deliberately demoted in the daily
 *          loop, because Pham & Taylor (1999) found outcome-simulation made
 *          students perform WORSE than controls. "…all these things shall be
 *          added unto you." Matt 6:33
 *
 * This module owns the vote ledger and the tier ladder.
 */

/**
 * The ladder an identity climbs. Thresholds are evidence counts, and the top
 * rung is set at 66 deliberately: Lally et al. (2010) found a MEDIAN of 66
 * days for a behaviour to reach its automaticity plateau.
 */
const IDENTITY_TIERS = [
  {
    key: 'called',
    name: 'Called',
    minVotes: 0,
    minRate: 0,
    ref: 'Judges 6:12',
    line: 'Named before the evidence exists. This is not pretending — it is the order God uses.',
  },
  {
    key: 'reckoned',
    name: 'Reckoned',
    minVotes: 3,
    minRate: 0.5,
    ref: 'Romans 6:11',
    line: '"Reckon" is an accounting word. It is on the books now, and you are beginning to live off the balance.',
  },
  {
    key: 'evidenced',
    name: 'Evidenced',
    minVotes: 12,
    minRate: 0.6,
    ref: 'Hebrews 11:1',
    line: 'There is now a body of evidence. Faith is the substance of things hoped for — and you are producing the substance.',
  },
  {
    key: 'established',
    name: 'Established',
    minVotes: 30,
    minRate: 0.7,
    ref: 'Proverbs 16:3',
    line: 'Your thoughts are established. This identity now survives days when you do not feel like it.',
  },
  {
    key: 'second_nature',
    name: 'Second Nature',
    minVotes: 66,
    minRate: 0.8,
    ref: '2 Corinthians 5:17',
    line: 'The plateau. Lally found a median of 66 days to automaticity; you are past it. Old things are passed away.',
  },
];

/** Words too vague to function as a possible self (Markus & Nurius 1986). */
const VAGUE_TERMS = [
  'successful', 'happy', 'better', 'rich', 'great', 'good', 'healthy',
  'wealthy', 'productive', 'motivated', 'disciplined', 'consistent',
  'amazing', 'winner', 'best', 'strong', 'fit', 'blessed', 'free',
];

/**
 * Validate an identity statement.
 *
 * Rejects abstractions on purpose. Markus & Nurius (1986) found that the
 * SPECIFICITY of a future-self representation predicts effort toward it —
 * "I am successful" is a mood, "I am a man who trains before sunrise" is a
 * blueprint. The gate is the mechanic.
 *
 * @param {string} statement e.g. "I am a man who trains before sunrise"
 */
function validateIdentity(statement) {
  const errors = [];
  const raw = String(statement || '').trim();

  if (!raw) {
    return { ok: false, errors: [{ code: 'empty', message: 'Name who you are becoming.' }] };
  }

  const lower = raw.toLowerCase();

  if (!/^i\s+am\b/.test(lower)) {
    errors.push({
      code: 'not_present_tense',
      message: 'Begin with "I am". Not "I want to be", not "I will be" — the name comes before the evidence.',
      help: 'Romans 4:17 — God "calleth those things which be not as though they were."',
    });
  }

  if (/\b(want|trying|hope|wish|will be|going to|someday|one day)\b/.test(lower)) {
    errors.push({
      code: 'future_tense',
      message: 'Aspiration language postpones the identity. State it as already true.',
      help: 'Gideon was called a mighty man of valour while hiding in a winepress.',
    });
  }

  // Must contain an observable behaviour, not just an adjective.
  const hasWho = /\bwho\b|\bthat\b/.test(lower);
  const verbish = /\b\w+(s|es|ing)\b/.test(lower.replace(/^i\s+am\s+/, ''));
  if (!hasWho || !verbish) {
    errors.push({
      code: 'no_behaviour',
      message: 'Name a behaviour someone could watch you do. Try "I am a person who ___".',
      help: 'Markus & Nurius (1986): vague possible selves do not drive effort. Specific ones do.',
    });
  }

  const tail = lower.replace(/^i\s+am\s+(a|an|the)?\s*/, '').trim();
  const onlyVague = VAGUE_TERMS.some((t) => tail === t || tail === `${t} person` || tail === `${t} man` || tail === `${t} woman`);
  if (onlyVague) {
    errors.push({
      code: 'vague',
      message: `"${tail}" is a feeling, not a self. What does that person actually DO on a Tuesday?`,
      help: 'Possible-selves research: the concrete beats the aspirational every time.',
    });
  }

  if (raw.length < 12) {
    errors.push({ code: 'too_short', message: 'Say more. One clause with a real action in it.' });
  }

  return { ok: errors.length === 0, errors, normalized: raw };
}

/**
 * Tally the evidence for one identity.
 *
 * @param {Array<{identityId:string, day:string, for:boolean}>} votes
 * @param {string} identityId
 * @param {object} opts
 * @param {number} opts.window rolling window in days for the RATE (default 30)
 * @param {string} opts.today
 */
function tallyIdentity(votes, identityId, { window = 30, today } = {}) {
  const mine = votes.filter((v) => v.identityId === identityId);
  const forVotes = mine.filter((v) => v.for !== false);
  const againstVotes = mine.filter((v) => v.for === false);

  let windowed = mine;
  if (today) {
    const days = new Set(dayRange(shiftBack(today, window - 1), today));
    windowed = mine.filter((v) => days.has(v.day));
  }
  const winFor = windowed.filter((v) => v.for !== false).length;
  const winTotal = windowed.length;
  const rate = winTotal > 0 ? winFor / winTotal : 0;

  const tier = tierFor(forVotes.length, rate);
  const next = IDENTITY_TIERS[IDENTITY_TIERS.indexOf(tier) + 1] || null;

  return {
    identityId,
    votesFor: forVotes.length,
    votesAgainst: againstVotes.length,
    total: mine.length,
    windowFor: winFor,
    windowTotal: winTotal,
    /** 0..1 — the share of recent actions that voted FOR this self. */
    rate,
    ratePct: pct(rate),
    tier,
    nextTier: next,
    votesToNext: next ? Math.max(0, next.minVotes - forVotes.length) : 0,
    rateToNext: next ? Math.max(0, next.minRate - rate) : 0,
    /** Lally's asymptotic automaticity curve, plateau ~66 reps. */
    automaticity: automaticityAt(forVotes.length),
  };
}

function tierFor(votesFor, rate) {
  let current = IDENTITY_TIERS[0];
  for (const t of IDENTITY_TIERS) {
    if (votesFor >= t.minVotes && rate >= t.minRate) current = t;
  }
  return current;
}

/**
 * Habit automaticity as an asymptotic curve (Lally et al. 2010).
 * a(n) = 1 − e^(−n/k), k chosen so a(66) ≈ 0.80 — the observed median plateau.
 */
function automaticityAt(reps) {
  const k = 41; // −66 / ln(0.2)  ≈ 41
  // Ceiling below 1: the curve is asymptotic, and at large rep counts the
  // exponential underflows to exactly 0 in floating point, which would
  // display a habit as "100% automatic". Lally's curve never gets there.
  return clamp(1 - Math.exp(-Math.max(0, reps) / k), 0, 0.999);
}

/**
 * The sentence the game says instead of "task complete".
 * This IS the Be>Do>Have mechanic surfacing — never report a task, always
 * report what the action proved about the person.
 */
function evidenceStatement(identity, tally) {
  const name = identity?.statement || 'this self';
  if (tally.total === 0) {
    return {
      headline: `${name} — called, not yet witnessed.`,
      body: 'No evidence has been cast yet. Gideon was hiding in a winepress, threshing wheat in fear, when the angel called him a mighty man of valour. The name came first. The evidence came after.',
      ref: 'Judges 6:12',
    };
  }
  return {
    headline: `The evidence says: ${name} — ${tally.ratePct}% of the time.`,
    body:
      tally.rate >= 0.8
        ? 'You are not deciding to be this person any more. You are watching yourself be them.'
        : tally.rate >= 0.5
          ? 'The ledger is tipping in your favour. Keep casting votes.'
          : 'The evidence is currently voting for the old self. That is information, not condemnation — one vote today changes the tally.',
    ref: tally.tier.ref,
  };
}

/**
 * The BE>DO>HAVE chain for one vision Stone: which identity does this HAVE
 * belong to, and what is the next vote available today?
 */
function chainFor(stone, identities, quests) {
  const identity = identities.find((i) => i.id === stone.identityId) || null;
  const linked = quests.filter((q) => q.stoneId === stone.id && !q.archived);
  const open = linked.filter((q) => !q.completedAt);
  return {
    be: identity,
    do: open,
    have: stone,
    ready: Boolean(identity) && open.length > 0,
    missing: !identity ? 'be' : open.length === 0 ? 'do' : null,
  };
}
