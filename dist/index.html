/* ─── core/engine.js ─────────────────────────────────────── */

/**
 * engine.js — the rules of play.
 *
 * Five subsystems, each one traceable to a study and a verse:
 *   1. The WOOP Gate         — Oettingen (2012)      / Luke 14:28
 *   2. If-then quests        — Gollwitzer & Sheeran  / Ecclesiastes 3:1
 *   3. The Calibration Engine— Wilson et al. (2019)  / Luke 16:10
 *   4. XP, goal gradient, Manna — Schultz (1997), Kivetz (2006) / Exodus 16
 *   5. Grace & restoration   — Lally (2010), Cochran & Tesser / Proverbs 24:16
 */

// ─────────────────────────────────────────────────────────────────────────
// 1. THE WOOP GATE
//    A vision Stone stays veiled and inert until it has been contrasted.
//    This is the hardest gate in the game, and it is the most important one.
//    Oettingen's finding is blunt: positive fantasy ALONE predicts LOWER
//    attainment. An uncontrasted vision board is not neutral — it is a
//    documented de-motivator, because indulging the feeling of having
//    arrived discharges the energy needed to go.
//    Christ said it first: sit down FIRST and count the cost. (Luke 14:28)
// ─────────────────────────────────────────────────────────────────────────

/** Obstacles that point outward. WOOP requires the INNER one. */
const EXTERNAL_OBSTACLE_HINTS = [
  'no time', 'no money', 'economy', 'my boss', 'my job', 'my wife', 'my husband',
  'my parents', 'the government', 'other people', 'they ', 'nobody ', 'everyone ',
  'not enough time', 'too busy', 'the market',
];

function validateWoop(woop = {}) {
  const errors = [];
  const f = (k) => String(woop[k] || '').trim();

  if (f('wish').length < 4) {
    errors.push({ field: 'wish', message: 'Name the wish in your own words.' });
  }
  if (f('outcome').length < 8) {
    errors.push({
      field: 'outcome',
      message: 'Describe the best outcome vividly — what does it actually feel like?',
      help: 'The vivid outcome is what generates the energy that contrasting then aims.',
    });
  }

  const obstacle = f('obstacle');
  if (obstacle.length < 8) {
    errors.push({
      field: 'obstacle',
      message: 'Name the obstacle INSIDE you. This is the step people skip, and skipping it is what makes vision boards fail.',
      help: 'Oettingen (2012): fantasy without contrasting predicts LOWER attainment.',
    });
  } else {
    const lower = obstacle.toLowerCase();
    const external = EXTERNAL_OBSTACLE_HINTS.find((h) => lower.includes(h));
    if (external) {
      errors.push({
        field: 'obstacle',
        code: 'external',
        message: `"${external.trim()}" is outside you. WOOP only works on the inner obstacle — the habit, the fear, the story you tell at the moment of choice.`,
        help: 'Try: "I tell myself I will do it later, and then I do not."',
      });
    }
  }

  const plan = f('plan');
  const planCheck = validateIfThen(plan);
  if (!planCheck.ok) {
    errors.push({
      field: 'plan',
      message: 'The plan must be if-then: "When [obstacle appears], I will [specific response]."',
      help: 'Gollwitzer & Sheeran (2006), 94 studies, d = 0.65 — if-then roughly doubles attainment.',
      detail: planCheck.errors,
    });
  }

  return { ok: errors.length === 0, errors };
}

// ─────────────────────────────────────────────────────────────────────────
// 2. IF-THEN QUESTS
//    The composer refuses a bare verb. "Go to the gym" is a goal intention.
//    "When I put my keys down after work, I will change into my shoes
//    immediately" is an implementation intention, and it hands control from
//    effortful prefrontal deliberation to an automatic cue-driven response.
// ─────────────────────────────────────────────────────────────────────────

const CUE_MARKERS = /\b(when|after|before|as soon as|the moment|once|if|every time|upon)\b/i;
const TIME_MARKERS = /\b(\d{1,2}\s*(am|pm)|\d{1,2}:\d{2}|morning|noon|evening|night|sunrise|sunset|breakfast|lunch|dinner|bed|wake|waking)\b/i;

function validateIfThen(text) {
  const errors = [];
  const raw = String(text || '').trim();

  if (!raw) {
    return { ok: false, errors: [{ code: 'empty', message: 'Write the quest as an if-then.' }] };
  }

  const hasCue = CUE_MARKERS.test(raw) || TIME_MARKERS.test(raw);
  if (!hasCue) {
    errors.push({
      code: 'no_cue',
      message: 'No cue. Start with "When…", "After…", or a specific time.',
      help: 'A cue is what fires the behaviour without you having to decide again.',
    });
  }

  const hasAction = /\bi\s+will\b|\bi'?ll\b/i.test(raw);
  if (!hasAction) {
    errors.push({
      code: 'no_action',
      message: 'No committed action. The second half must be "…I will [do the specific thing]."',
    });
  }

  if (raw.length < 15) {
    errors.push({ code: 'too_vague', message: 'Too short to be specific enough to fire automatically.' });
  }

  return {
    ok: errors.length === 0,
    errors,
    hasCue,
    hasAction,
    hasTime: TIME_MARKERS.test(raw),
    hasPlace: /\bat\s+(the\s+)?\w+|\bin\s+(the\s+)?\w+/i.test(raw),
  };
}

/** Compose a valid if-then from structured parts. */
function composeIfThen({ cue, action, place }) {
  const c = String(cue || '').trim().replace(/^when\s+/i, '');
  const a = String(action || '').trim().replace(/^i\s+will\s+/i, '');
  const p = String(place || '').trim();
  if (!c || !a) return '';
  return `When ${c}, I will ${a}${p ? ` at ${p}` : ''}.`;
}

// ─────────────────────────────────────────────────────────────────────────
// 3. THE CALIBRATION ENGINE
//    Wilson et al. (2019) put the optimal training point near 85% success —
//    hard enough to generate an error signal, easy enough to remain
//    trainable. The game therefore watches your real completion rate and
//    resizes the ask, out loud. "Faithful in that which is least." Luke 16:10
// ─────────────────────────────────────────────────────────────────────────

const CALIBRATION = {
  target: 0.85,
  band: [0.6, 0.9],
  minSample: 4,
  window: 12,
};

function calibrate(recentOutcomes, cfg = CALIBRATION) {
  const sample = recentOutcomes.slice(-cfg.window);
  const n = sample.length;

  if (n < cfg.minSample) {
    return {
      action: 'hold',
      rate: n ? sample.filter(Boolean).length / n : 0,
      sample: n,
      confident: false,
      message: `Still learning your real capacity — ${cfg.minSample - n} more rep${cfg.minSample - n === 1 ? '' : 's'} before the game starts resizing your steps.`,
      ref: 'Luke 16:10',
    };
  }

  const rate = sample.filter(Boolean).length / n;
  const [lo, hi] = cfg.band;

  if (rate > hi) {
    return {
      action: 'increase',
      rate,
      sample: n,
      confident: true,
      delta: +1,
      message: `You are completing ${Math.round(rate * 100)}% — above the ${Math.round(hi * 100)}% ceiling. The step is too small to teach you anything. Making the next one bigger.`,
      why: 'Learning needs an error signal. A task you never fail produces none (Wilson et al. 2019).',
      ref: 'Matthew 25:21',
    };
  }
  if (rate < lo) {
    return {
      action: 'decrease',
      rate,
      sample: n,
      confident: true,
      delta: -1,
      message: `You are completing ${Math.round(rate * 100)}% — under the ${Math.round(lo * 100)}% floor. That is not a character problem, it is a sizing problem. Shrinking the next step.`,
      why: 'Below the band, failure stops carrying information and starts carrying shame.',
      ref: 'Zechariah 4:10',
    };
  }
  return {
    action: 'hold',
    rate,
    sample: n,
    confident: true,
    delta: 0,
    message: `${Math.round(rate * 100)}% completion — inside the training band. This is exactly where learning is fastest. Holding the size.`,
    why: 'Optimal learning sits near 85% success (Wilson et al. 2019).',
    ref: 'Psalm 37:23',
  };
}

/** Quest difficulty ladder the calibrator moves you along. */
const DIFFICULTY = [
  { level: 1, name: 'Seed', minutes: 5, xp: 10, line: 'A grain of mustard seed.' },
  { level: 2, name: 'Step', minutes: 15, xp: 20, line: 'One ordered step.' },
  { level: 3, name: 'Stretch', minutes: 30, xp: 35, line: 'Beyond comfortable.' },
  { level: 4, name: 'Climb', minutes: 60, xp: 60, line: 'A real ascent.' },
  { level: 5, name: 'Siege', minutes: 120, xp: 100, line: 'Walls come down slowly.' },
];

function adjustDifficulty(current, delta) {
  return clamp(current + delta, 1, DIFFICULTY.length);
}

function difficulty(level) {
  return DIFFICULTY[clamp(level, 1, DIFFICULTY.length) - 1];
}

// ─────────────────────────────────────────────────────────────────────────
// 4. XP, GOAL GRADIENT, AND MANNA
//    Schultz (1997): dopamine encodes reward MINUS expectation. A fully
//    predicted reward teaches nothing. So the predictable payout is kept
//    modest and honest, and the learning signal comes from Manna landing on
//    a variable-ratio schedule (Ferster & Skinner 1957) — the schedule with
//    the highest persistence and the greatest resistance to extinction.
//
//    Manna cannot be hoarded. Exodus 16:20: what was kept overnight "bred
//    worms, and stank." Unspent Manna decays, which is both the scripture
//    and the correct anti-addiction design.
// ─────────────────────────────────────────────────────────────────────────

const REWARD = {
  mannaChance: 0.25,          // average 1 in 4 — variable ratio, never fixed
  mannaDailyCap: 3,           // hard ceiling. This is a person's life, not a casino.
  mannaDecayDays: 2,          // unspent manna spoils
  gradientMax: 1.6,           // XP multiplier at the very edge of completion
  focusBonus: 0.5,            // attention-gated plasticity premium
  sealedBonus: 0.15,          // public commitment premium (Cialdini)
};

/**
 * Goal-gradient multiplier. Effort accelerates as the goal nears, so the
 * reward should too (Kivetz et al. 2006).
 * @param {number} progress 0..1 completion of the parent Stone
 */
function gradientMultiplier(progress, cfg = REWARD) {
  const p = clamp(progress || 0, 0, 1);
  return 1 + (cfg.gradientMax - 1) * Math.pow(p, 1.5);
}

/**
 * Award for one completed quest.
 *
 * @param {object} args
 * @param {number} args.level difficulty level 1..5
 * @param {number} args.stoneProgress 0..1
 * @param {boolean} args.focused completed inside an Upper Room focus block
 * @param {boolean} args.sealed sealed to the Covenant Circle
 * @param {number} args.mannaToday manna already granted today
 * @param {string} args.seed deterministic seed (questId + day)
 */
function awardFor({ level = 1, stoneProgress = 0, focused = false, sealed = false, mannaToday = 0, seed = '' }, cfg = REWARD) {
  const base = difficulty(level).xp;
  const gradient = gradientMultiplier(stoneProgress, cfg);
  let xp = base * gradient;
  const bonuses = [];

  if (focused) {
    xp *= 1 + cfg.focusBonus;
    bonuses.push({ key: 'focus', label: 'Upper Room', why: 'Plasticity is gated by attention (Recanzone/Merzenich 1993).' });
  }
  if (sealed) {
    xp *= 1 + cfg.sealedBonus;
    bonuses.push({ key: 'sealed', label: 'Sealed to the Circle', why: 'Witnessed commitments are kept more often (Cialdini).' });
  }

  // Variable-ratio Manna, hard-capped per day.
  const rng = seededRandom(hashStr(String(seed)));
  const roll = rng();
  const manna = mannaToday < cfg.mannaDailyCap && roll < cfg.mannaChance;

  return {
    xp: Math.round(xp),
    baseXp: base,
    gradient: Math.round(gradient * 100) / 100,
    bonuses,
    manna,
    mannaRoll: Math.round(roll * 1000) / 1000,
    /** True when the payout exceeded the plain expectation — the RPE moment. */
    surprise: manna || gradient > 1.25,
  };
}

/** Expire manna older than the decay window. Exodus 16:20. */
function decayManna(mannaGrants, today, cfg = REWARD) {
  const kept = [];
  const spoiled = [];
  for (const g of mannaGrants) {
    if (g.spent) { kept.push(g); continue; }
    const age = daysBetween(g.day, today);
    if (age > cfg.mannaDecayDays) spoiled.push(g);
    else kept.push(g);
  }
  return { kept, spoiled, spoiledCount: spoiled.length };
}

// ─────────────────────────────────────────────────────────────────────────
// 5. GRACE, STREAKS AND RESTORATION
//    The most common mechanic in habit apps is also the most destructive:
//    miss one day, lose everything. Lally (2010) found a single missed day
//    did NOT measurably harm the automaticity trajectory — so zeroing the
//    streak is not just cruel, it is factually wrong. And the all-or-nothing
//    framing triggers the what-the-hell effect: the lapse does little damage,
//    the interpretation does.
//
//    "For a just man falleth seven times, and riseth up again." Prov 24:16
//    "They are new every morning."                              Lam 3:23
// ─────────────────────────────────────────────────────────────────────────

const GRACE = {
  maxTokens: 3,
  /** You begin with grace already in hand. It is not earned first — that is the point of it. */
  startingTokens: 1,
  earnEveryNActiveDays: 7,
  momentumPenalty: 0.25,   // a covered miss costs momentum, not the streak
};

/**
 * Walk the calendar and produce the streak state.
 *
 * @param {Array<string>} activeDays day keys with >=1 completion
 * @param {string} today
 */
function computeStreak(activeDays, today, cfg = GRACE) {
  const set = new Set(activeDays);
  if (!set.size) {
    return {
      current: 0, longest: 0, tokens: cfg.startingTokens, tokensSpent: 0,
      state: 'unbegun', momentum: 0, missedDays: [],
      message: 'Nothing counted yet. The first vote is the whole game.',
      ref: 'Zechariah 4:10',
    };
  }

  const sorted = [...set].sort();
  const first = sorted[0];

  let current = 0;
  let longest = 0;
  let tokens = cfg.startingTokens;
  let tokensSpent = 0;
  let activeCount = 0;
  const missedDays = [];
  let cursor = first;
  let todayPending = false;

  while (true) {
    const active = set.has(cursor);

    // Today is not over. An unfinished today is not a missed day — the game
    // must never tell someone at 9am that their run has ended.
    if (!active && cursor === today) {
      todayPending = true;
      break;
    }

    if (active) {
      current += 1;
      activeCount += 1;
      if (activeCount % cfg.earnEveryNActiveDays === 0) {
        tokens = Math.min(cfg.maxTokens, tokens + 1);
      }
    } else {
      missedDays.push(cursor);
      if (tokens > 0) {
        // Grace covers the gap. The streak survives; momentum takes the hit.
        tokens -= 1;
        tokensSpent += 1;
      } else {
        // No token left — the run ends, but lifetime totals are never erased.
        longest = Math.max(longest, current);
        current = 0;
      }
    }

    longest = Math.max(longest, current);
    if (cursor === today) break;
    cursor = addDays(cursor, 1);
    // Safety: never walk past today.
    if (daysBetween(cursor, today) < 0) break;
  }

  const coveredRecently = missedDays.filter((d) => daysBetween(d, today) <= 7).length;
  const momentum = clamp(1 - coveredRecently * cfg.momentumPenalty, 0, 1);

  let state = 'running';
  let message = `${current} day${current === 1 ? '' : 's'} standing.`;
  let ref = 'Psalm 1:3';

  if (todayPending && current > 0) {
    message = `${current} day${current === 1 ? '' : 's'} standing. Today is still open.`;
  } else if (current === 0) {
    state = 'restoration';
    message = 'The run ended — but nothing you built was erased. This is a return, not a restart.';
    ref = 'Isaiah 43:19';
  } else if (tokensSpent > 0 && missedDays.some((d) => daysBetween(d, today) <= 2)) {
    state = 'graced';
    message = 'You missed, and grace covered it. The streak stands. Momentum is lighter — earn it back today.';
    ref = 'Lamentations 3:23';
  }

  return {
    current,
    longest,
    tokens,
    tokensSpent,
    state,
    momentum,
    missedDays,
    todayPending,
    message,
    ref,
  };
}

/**
 * The fresh-start framing after a break (Dai, Milkman & Riis 2014).
 * A return is dated as a NEW SEASON, never as a resumed failure.
 */
function restorationFraming(lastActiveDay, today) {
  const gap = lastActiveDay ? daysBetween(lastActiveDay, today) : 0;
  return {
    gap,
    title: gap >= 14 ? 'A new thing' : gap >= 3 ? 'A new season' : 'A new morning',
    body:
      gap >= 14
        ? 'It has been a while. Scripture does not treat that as disqualification — it treats it as the setting for a new thing. Nothing you built has been deleted.'
        : gap >= 3
          ? 'A few days passed. The evidence you already banked is still on the books. Cast one vote and the tally moves today.'
          : 'Yesterday is closed. His compassions are new this morning.',
    ref: gap >= 14 ? 'Isaiah 43:19' : 'Lamentations 3:23',
    /** Deliberately tiny — re-entry must be easy or it will not happen. */
    suggestedLevel: 1,
  };
}

// ─────────────────────────────────────────────────────────────────────────
// 6. THE SABBATH LOCK
//    A game that refuses to let you play. Sonnentag & Fritz (2007) found
//    psychological DETACHMENT predicts recovery better than rest alone,
//    so the lock has to actually withhold the quests.
//    "Remember the sabbath day, to keep it holy." Exodus 20:8
// ─────────────────────────────────────────────────────────────────────────

function sabbathState(settings, today) {
  if (!settings?.sabbathEnabled) return { locked: false, enabled: false };
  const dow = weekdayOf(today);
  const locked = dow === (settings.sabbathDay ?? 0);
  return {
    enabled: true,
    locked,
    day: settings.sabbathDay ?? 0,
    message: locked
      ? 'The Sabbath lock is on. No quests today — this is not the game breaking, it is the game working. Detachment is what makes the next six days possible.'
      : null,
    ref: 'Exodus 20:8',
    allowed: locked ? ['reflect', 'circle', 'recap', 'chronicle'] : null,
  };
}

// ─────────────────────────────────────────────────────────────────────────
// 7. THE UPPER ROOM — focus blocks with mandatory stillness
// ─────────────────────────────────────────────────────────────────────────

const FOCUS_PRESETS = [
  { minutes: 25, rest: 5, name: 'Watch', ref: 'Matthew 26:40', line: 'Could ye not watch with me one hour?' },
  { minutes: 50, rest: 10, name: 'Ascent', ref: 'Psalm 24:3', line: 'Who shall ascend into the hill of the LORD?' },
  { minutes: 90, rest: 20, name: 'Upper Room', ref: 'Acts 1:13', line: 'They went up into an upper room, and continued.' },
];

/**
 * Growth credit for a focus block. Skipping the stillness window forfeits
 * part of it — Foster & Wilson (2006) showed post-training quiet rest
 * produces the compressed replay that predicts later performance.
 */
function focusCredit({ minutes, restTaken, restRequired }) {
  const base = minutes;
  const restRatio = restRequired > 0 ? clamp((restTaken || 0) / restRequired, 0, 1) : 1;
  const consolidation = 0.7 + 0.3 * restRatio;
  return {
    raw: base,
    credited: Math.round(base * consolidation),
    consolidation: Math.round(consolidation * 100) / 100,
    forfeited: Math.round(base * (1 - consolidation)),
    message:
      restRatio >= 1
        ? 'Full consolidation credit. The stillness is where the replay happens.'
        : `Partial credit — you skipped ${Math.round((1 - restRatio) * 100)}% of the stillness. Quiet rest right after practice is when the sequence replays.`,
    ref: 'Psalm 46:10',
  };
}

/** Refuse to chain more than two blocks without real recovery (ultradian limit). */
function canStartFocus(blocksToday, lastBlockEndedAt, now = Date.now()) {
  const recent = blocksToday.filter((b) => now - b.endedAt < 3 * 3600 * 1000);
  if (recent.length < 2) return { ok: true };
  const sinceLast = lastBlockEndedAt ? now - lastBlockEndedAt : Infinity;
  if (sinceLast < 20 * 60 * 1000) {
    return {
      ok: false,
      message: 'Two blocks back to back is the ceiling. Vigilance is already degrading; take twenty minutes properly.',
      ref: 'Isaiah 40:31',
      waitMs: 20 * 60 * 1000 - sinceLast,
    };
  }
  return { ok: true };
}

// ─────────────────────────────────────────────────────────────────────────
// 8. STONE PROGRESS — the HAVE, unlocked by evidence rather than stared at
// ─────────────────────────────────────────────────────────────────────────

function stoneProgress(stone, quests) {
  const linked = quests.filter((q) => q.stoneId === stone.id && !q.archived);
  if (!linked.length) return { progress: 0, done: 0, total: 0, veiled: !stone.woopComplete };
  const done = linked.filter((q) => q.completedAt).length;
  const progress = done / linked.length;
  return {
    progress,
    done,
    total: linked.length,
    veiled: !stone.woopComplete,
    /** Distance remaining, per the goal-gradient framing — never a raw count. */
    remaining: linked.length - done,
    /**
     * Kivetz (2006) is about proximity to the goal, not the ratio: one step
     * left is maximum proximity however many there were to begin with.
     */
    nearing: progress >= 0.7 || linked.length - done <= 1,
  };
}


/* ─── core/growth.js ─────────────────────────────────────── */

/**
 * growth.js — Linear and exponential, running at the same time.
 *
 * This is the module that answers the design brief directly: the player must
 * move linearly AND exponentially simultaneously, and must be able to SEE
 * both at once.
 *
 * ── THE TWO LINES ────────────────────────────────────────────────────────
 *
 * STEPS (linear).  L(t) = Σ steps.  One faithful act = one step. Nothing
 * clever. This is obedience, counted plainly.
 *     "Who hath despised the day of small things?"  — Zechariah 4:10
 *
 * INCREASE (exponential).  A compounding balance:
 *
 *     I(t) = I(t-1) × (1 + g_t) + steps_t
 *
 * Identical in form to compound interest: yesterday's balance grows by rate
 * g, then today's deposit lands on top. The honesty of this model is the
 * point — g is not a decoration, it is EARNED, and when it collapses to zero
 * the two lines lie exactly on top of each other:
 *
 *     g_t = 0  ⟹  I(t) = Σ steps = L(t)
 *
 * So an inconsistent player literally sees one line. There is no exponential
 * without consistency, and the graph refuses to lie about it.
 *
 * ── WHERE g COMES FROM ───────────────────────────────────────────────────
 * Three earned terms, all bounded:
 *   consistency — share of the recent window with at least one step
 *                 (Lally 2010: automaticity is built by frequency, not intensity)
 *   alignment   — share of actions that voted for the declared identity
 *                 (Bem 1972: the self is inferred from accumulated behaviour)
 *   circle      — a genuine network term from the Covenant Circle
 *                 (Christakis & Fowler 2007: behaviour spreads through networks)
 *
 * The network term is what makes this properly exponential rather than merely
 * accelerating: it is the only input that can grow without the player
 * personally spending more hours.
 *     "some thirty, and some sixty, and some an hundred."  — Mark 4:8
 *
 * ── THE YIELD ────────────────────────────────────────────────────────────
 * Yield = (Increase − Steps) / Steps. It is everything compounding gave that
 * raw effort did not, and it is reported in the parable's own units:
 * thirtyfold, sixtyfold, hundredfold.
 */

const GROWTH_CONFIG = {
  /** Ceiling on the daily compounding rate. 4.5%/day sustained is dramatic but not absurd. */
  maxDailyRate: 0.045,
  /** Days of history the consistency term looks back over. */
  consistencyWindow: 14,
  /** Weight of each earned term in g. Must sum to 1. */
  weights: { consistency: 0.5, alignment: 0.3, circle: 0.2 },
  /** Covenant partners at which the network term saturates. */
  circleSaturation: 5,
  /** Yield thresholds, in the units of Mark 4:8. */
  yieldTiers: [
    { at: 1.0, label: 'Hundredfold', ref: 'Mark 4:8' },
    { at: 0.6, label: 'Sixtyfold', ref: 'Mark 4:8' },
    { at: 0.3, label: 'Thirtyfold', ref: 'Mark 4:8' },
    { at: 0.0, label: 'Sown', ref: 'Mark 4:8' },
  ],
};

/**
 * Daily compounding rate for one day.
 * @param {{consistency:number, alignment:number, circle:number}} terms — each 0..1
 * @returns {number} rate in 0..maxDailyRate
 */
function dailyRate(terms, cfg = GROWTH_CONFIG) {
  const w = cfg.weights;
  const consistency = clamp(terms.consistency ?? 0, 0, 1);
  const alignment = clamp(terms.alignment ?? 0, 0, 1);
  const circle = clamp(terms.circle ?? 0, 0, 1);
  const composite = consistency * w.consistency + alignment * w.alignment + circle * w.circle;
  return clamp(composite, 0, 1) * cfg.maxDailyRate;
}

/**
 * Network term from the Covenant Circle. Saturating, not linear — a hundred
 * shallow contacts do not beat five real ones.
 * @param {number} activePartners partners who moved in the window
 */
function circleTerm(activePartners, cfg = GROWTH_CONFIG) {
  if (!activePartners || activePartners <= 0) return 0;
  return clamp(
    Math.log(1 + activePartners) / Math.log(1 + cfg.circleSaturation),
    0,
    1,
  );
}

/**
 * Consistency over a trailing window ending at `today`.
 * @param {Set<string>|Array<string>} activeDays day keys with >=1 step
 */
function consistencyTerm(activeDays, today, cfg = GROWTH_CONFIG) {
  const set = activeDays instanceof Set ? activeDays : new Set(activeDays);
  if (!set.size) return 0;
  const window = cfg.consistencyWindow;
  let hits = 0;
  const days = dayRange(shiftBack(today, window - 1), today);
  for (const d of days) if (set.has(d)) hits++;
  return clamp(hits / window, 0, 1);
}

/**
 * Run both tracks across a span of days.
 *
 * @param {Array<{day:string, steps:number, terms:{consistency:number,alignment:number,circle:number}}>} series
 * @returns {{points:Array, steps:number, increase:number, yield:number, tier:object}}
 */
function runGrowth(series, cfg = GROWTH_CONFIG) {
  let linear = 0;
  let increase = 0;
  const points = [];

  for (const day of series) {
    const steps = Math.max(0, day.steps || 0);
    const g = dailyRate(day.terms || {}, cfg);

    linear += steps;
    // Compound yesterday's balance, then deposit today's steps.
    increase = increase * (1 + g) + steps;

    points.push({
      day: day.day,
      steps,
      rate: g,
      linear: round2(linear),
      increase: round2(increase),
      gap: round2(increase - linear),
    });
  }

  const y = linear > 0 ? (increase - linear) / linear : 0;
  return {
    points,
    steps: round2(linear),
    increase: round2(increase),
    yield: round2(y),
    tier: yieldTier(y, cfg),
  };
}

function yieldTier(y, cfg = GROWTH_CONFIG) {
  return cfg.yieldTiers.find((t) => y >= t.at) || cfg.yieldTiers[cfg.yieldTiers.length - 1];
}

/**
 * Project the curve forward under an assumed steady rate — used by the
 * "if you hold this pace" panel. Honest about being a projection.
 */
function project(fromLinear, fromIncrease, stepsPerDay, rate, days) {
  let L = fromLinear;
  let I = fromIncrease;
  const out = [];
  for (let i = 1; i <= days; i++) {
    L += stepsPerDay;
    I = I * (1 + rate) + stepsPerDay;
    out.push({ dayOffset: i, linear: round2(L), increase: round2(I) });
  }
  return out;
}

/**
 * Days until the Increase curve reaches a multiple of the linear line at a
 * held pace. Returns null if the pace can never get there.
 */
function daysToYield(targetYield, stepsPerDay, rate, maxDays = 3650) {
  if (rate <= 0 || stepsPerDay <= 0) return null;
  let L = 0;
  let I = 0;
  for (let d = 1; d <= maxDays; d++) {
    L += stepsPerDay;
    I = I * (1 + rate) + stepsPerDay;
    if (L > 0 && (I - L) / L >= targetYield) return d;
  }
  return null;
}

function round2(n) {
  return Math.round(n * 100) / 100;
}

/**
 * Build the day-series the growth model needs from raw event logs.
 *
 * @param {object} args
 * @param {Array<{day:string, identityId?:string, aligned?:boolean}>} args.completions
 * @param {string} args.from first day key
 * @param {string} args.to   last day key
 * @param {(day:string)=>number} args.activePartnersOn
 */
function buildSeries({ completions, from, to, activePartnersOn = () => 0 }, cfg = GROWTH_CONFIG) {
  const byDay = new Map();
  for (const c of completions) {
    if (!byDay.has(c.day)) byDay.set(c.day, []);
    byDay.get(c.day).push(c);
  }
  const activeDays = new Set(byDay.keys());

  return dayRange(from, to).map((day) => {
    const todays = byDay.get(day) || [];
    const steps = todays.length;
    const aligned = todays.filter((c) => c.aligned !== false).length;

    return {
      day,
      steps,
      terms: {
        consistency: consistencyTerm(activeDays, day, cfg),
        // No actions today ⇒ no alignment signal; carry 0 rather than inventing one.
        alignment: steps > 0 ? aligned / steps : 0,
        circle: circleTerm(activePartnersOn(day), cfg),
      },
    };
  });
}

/**
 * Terms to SHOW the player, as opposed to the terms used to compound a
 * single day.
 *
 * Today's alignment is 0 until today's first rep lands, so reading the last
 * day alone would tell someone at 9am that identity alignment is their
 * weakest link when in fact they simply have not gone yet. The panel instead
 * averages alignment across recent days that actually had actions.
 */
function displayTerms(series, cfg = GROWTH_CONFIG) {
  if (!series.length) return { consistency: 0, alignment: 0, circle: 0 };
  const last = series[series.length - 1];
  const window = series.slice(-cfg.consistencyWindow);
  const acted = window.filter((d) => d.steps > 0);
  const alignment = acted.length
    ? acted.reduce((a, d) => a + (d.terms.alignment || 0), 0) / acted.length
    : 0;
  return {
    consistency: last.terms.consistency,
    alignment,
    circle: last.terms.circle,
  };
}

/**
 * Plain-language explanation of why the curve is doing what it is doing.
 * Shown under the chart — the player should never wonder where the number came from.
 */
function explainRate(terms, cfg = GROWTH_CONFIG) {
  const w = cfg.weights;
  const parts = [
    {
      key: 'consistency',
      label: 'Consistency',
      value: clamp(terms.consistency ?? 0, 0, 1),
      weight: w.consistency,
      why: `Days moved in the last ${cfg.consistencyWindow}. Frequency builds automaticity; intensity does not (Lally 2010).`,
    },
    {
      key: 'alignment',
      label: 'Identity alignment',
      value: clamp(terms.alignment ?? 0, 0, 1),
      weight: w.alignment,
      why: 'Share of your actions that voted for who you said you are (Bem 1972).',
    },
    {
      key: 'circle',
      label: 'Covenant circle',
      value: clamp(terms.circle ?? 0, 0, 1),
      weight: w.circle,
      why: 'Partners moving alongside you. Behaviour spreads through networks (Christakis & Fowler 2007).',
    },
  ];
  const rate = dailyRate(terms, cfg);
  return {
    rate,
    ratePct: Math.round(rate * 10000) / 100,
    parts: parts.map((p) => ({
      ...p,
      contribution: Math.round(p.value * p.weight * cfg.maxDailyRate * 10000) / 100,
    })),
    weakest: parts.slice().sort((a, b) => a.value - b.value)[0],
  };
}


/* ─── core/storage.js ─────────────────────────────────────── */

/**
 * storage.js — persistence and the Covenant Circle transport.
 *
 * Two adapters behind one interface:
 *
 *   LocalAdapter     — everything on this device. Always available, works
 *                      offline, needs no account. The default.
 *   SupabaseAdapter  — a live Covenant Circle shared across devices, driven
 *                      by plain REST + polling. No SDK, no CDN script, no
 *                      build step, so it survives a strict CSP.
 *
 * The Why Vault is written under its own key and is never passed to any
 * adapter's `pushSnapshot`. See state.js for why that is structural.
 *
 *   "Two are better than one… a threefold cord is not quickly broken."
 *                                                    — Ecclesiastes 4:9,12
 */

const KEY_STATE = 'achieve.state.v1';
const KEY_VAULT = 'achieve.vault.v1';   // private. never synced. never exported.

// ── device persistence ────────────────────────────────────────────────────

/**
 * In-memory fallback for environments where localStorage is blocked
 * (sandboxed iframes, private-mode quirks). The game keeps working for the
 * session instead of failing on every save; the player is warned once that
 * it will not survive a reload.
 */
const memory = new Map();
let storageBroken = false;
let warnedOnce = false;

function backing() {
  try {
    const ls = globalThis.localStorage;
    if (!ls) return null;
    // Probe: some embeds expose the object but throw on write.
    ls.setItem('achieve.probe', '1');
    ls.removeItem('achieve.probe');
    return ls;
  } catch {
    storageBroken = true;
    return null;
  }
}

function loadLocal(key, fallback) {
  try {
    const ls = backing();
    const raw = ls ? ls.getItem(key) : memory.get(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function saveLocal(key, value) {
  const json = JSON.stringify(value);
  const ls = backing();

  if (!ls) {
    memory.set(key, json);
    if (storageBroken && !warnedOnce) {
      warnedOnce = true;
      return { ok: false, error: 'This browser is blocking local storage, so your progress will not survive a reload. Export a save to keep it.' };
    }
    return { ok: true, memoryOnly: true };
  }

  try {
    ls.setItem(key, json);
    return { ok: true };
  } catch (err) {
    // Quota is the realistic failure here — vision board images are large.
    memory.set(key, json);
    return {
      ok: false,
      error: err && err.name === 'QuotaExceededError'
        ? 'Storage is full — try a smaller vision board image, or export and clear old data.'
        : 'Could not save to this device. Your work is held in memory for now.',
    };
  }
}

const STATE_KEY = KEY_STATE;
const VAULT_KEY = KEY_VAULT;

function loadState() { return loadLocal(KEY_STATE, null); }
function saveState(s) { return saveLocal(KEY_STATE, s); }
function loadVault() { return loadLocal(KEY_VAULT, null); }
function saveVault(v) { return saveLocal(KEY_VAULT, v); }

/**
 * Wipe the vault only. Offered explicitly because a private thing the user
 * cannot delete is not actually private.
 */
function destroyVault() {
  try { globalThis.localStorage?.removeItem(KEY_VAULT); return true; } catch { return false; }
}

// ── circle codes ──────────────────────────────────────────────────────────

/**
 * Codes are long and random on purpose: with the Supabase adapter, the code
 * IS the access control (a secret-link model). Short codes would be
 * guessable, and a guessed code means a stranger in your circle.
 */
function makeCircleCode() {
  const alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no I/O/0/1 — spoken aloud
  let out = '';
  const bytes = new Uint8Array(16);
  (globalThis.crypto || {}).getRandomValues?.(bytes);
  for (let i = 0; i < 16; i++) {
    const b = bytes[i] || Math.floor(Math.random() * 256);
    out += alphabet[b % alphabet.length];
    if (i === 3 || i === 7 || i === 11) out += '-';
  }
  return out;
}

function normalizeCode(code) {
  return String(code || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').trim();
}

// ── adapter interface ─────────────────────────────────────────────────────

/**
 * Local circle: a real, working circle that never leaves the device. Useful
 * on its own (a solo covenant with your own history) and the honest fallback
 * when live sync is not configured.
 */
class LocalAdapter {
  constructor(state) {
    this.mode = 'local';
    this.live = false;
    this.state = state;
  }

  get label() { return 'On this device'; }

  async status() {
    return { ok: true, live: false, mode: 'local', message: 'Everything is stored on this device only.' };
  }

  async joinCircle(code, profile) {
    const c = normalizeCode(code) || makeCircleCode();
    this.state.circle.code = c;
    this.state.circle.joinedAt = Date.now();
    const me = this.state.circle.members.find((m) => m.playerId === profile.playerId);
    if (!me) this.state.circle.members.push({ ...profile, joinedAt: Date.now(), local: true });
    return { ok: true, code: c, live: false };
  }

  async leaveCircle() {
    this.state.circle = { code: null, joinedAt: null, members: [], messages: [] };
    return { ok: true };
  }

  async pushSnapshot() { return { ok: true, live: false }; }

  async fetchMembers() { return this.state.circle.members; }

  async fetchMessages() { return this.state.circle.messages; }

  async sendMessage(body, profile) {
    const msg = {
      id: uid('msg'),
      playerId: profile.playerId,
      displayName: profile.displayName,
      newName: profile.newName,
      body: String(body),
      createdAt: Date.now(),
      local: true,
    };
    this.state.circle.messages.push(msg);
    if (this.state.circle.messages.length > 500) this.state.circle.messages.shift();
    return { ok: true, message: msg };
  }
}

/**
 * Live circle over Supabase REST.
 *
 * Deliberately no SDK: a <script src="cdn…"> would be blocked outright under
 * the artifact CSP, and pinning an SDK version is a maintenance cost this
 * app does not need. Everything here is fetch + JSON.
 */
class SupabaseAdapter {
  constructor({ url, key, state }) {
    this.mode = 'supabase';
    this.live = true;
    this.url = String(url || '').replace(/\/+$/, '');
    this.key = String(key || '');
    this.state = state;
    this.lastError = null;
  }

  get label() { return 'Live circle'; }

  headers(extra = {}) {
    return {
      apikey: this.key,
      Authorization: `Bearer ${this.key}`,
      'Content-Type': 'application/json',
      ...extra,
    };
  }

  /**
   * Every call is an RPC. The tables themselves are unreadable with the anon
   * key by design — see supabase/schema.sql. This is what stops a holder of
   * the publishable key from simply omitting a filter and reading every
   * circle on the server.
   */
  async rpc(fn, args = {}) {
    if (!this.url || !this.key) {
      return { ok: false, error: 'Live sync is not configured.' };
    }
    try {
      const res = await fetch(`${this.url}/rest/v1/rpc/${fn}`, {
        method: 'POST',
        headers: this.headers(),
        body: JSON.stringify(args),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        this.lastError = friendlyError(res.status, text);
        return { ok: false, error: this.lastError, status: res.status };
      }
      const text = await res.text();
      return { ok: true, data: text ? JSON.parse(text) : null };
    } catch (err) {
      this.lastError = String(err);
      return { ok: false, error: 'Cannot reach the circle server.', offline: true };
    }
  }

  async status() {
    if (!this.state.circle.code) {
      // Nothing to read yet; a reachable host is the most we can confirm.
      const r = await this.rpc('get_members', { p_code: 'CONNECTIVITY-PROBE' });
      // An "invalid circle code" rejection still proves the server answered.
      const reachable = r.ok || (r.status && r.status < 500);
      return reachable
        ? { ok: true, live: true, mode: 'supabase', message: 'Live sync ready. Start or join a circle.' }
        : { ok: false, live: false, mode: 'supabase', message: this.lastError || 'Cannot reach the circle server.' };
    }
    const r = await this.rpc('get_members', { p_code: this.state.circle.code });
    if (!r.ok) {
      return { ok: false, live: false, mode: 'supabase', message: r.error };
    }
    return { ok: true, live: true, mode: 'supabase', message: 'Live circle connected.' };
  }

  async joinCircle(code, profile) {
    const c = normalizeCode(code) || makeCircleCode();
    const r = await this.rpc('join_circle', {
      p_code: c,
      p_player_id: profile.playerId,
      p_display_name: profile.displayName,
      p_new_name: profile.newName || null,
      p_snapshot: profile.snapshot || {},
    });
    if (!r.ok) return { ok: false, error: r.error };

    this.state.circle.code = c;
    this.state.circle.joinedAt = Date.now();
    return { ok: true, code: c, live: true };
  }

  async leaveCircle(profile) {
    const c = this.state.circle.code;
    if (c) await this.rpc('leave_circle', { p_code: c, p_player_id: profile.playerId });
    this.state.circle = { code: null, joinedAt: null, members: [], messages: [] };
    return { ok: true };
  }

  /** Publish the shareable snapshot — never the vault, never board images. */
  async pushSnapshot(profile, snapshot) {
    const c = this.state.circle.code;
    if (!c) return { ok: false, error: 'Not in a circle.' };
    return this.rpc('join_circle', {
      p_code: c,
      p_player_id: profile.playerId,
      p_display_name: profile.displayName,
      p_new_name: profile.newName || null,
      p_snapshot: snapshot,
    });
  }

  async fetchMembers() {
    const c = this.state.circle.code;
    if (!c) return [];
    const r = await this.rpc('get_members', { p_code: c });
    if (!r.ok) return this.state.circle.members;
    const members = (r.data || []).map((m) => ({
      playerId: m.player_id,
      displayName: m.display_name,
      newName: m.new_name,
      snapshot: m.snapshot || {},
      joinedAt: Date.parse(m.joined_at) || Date.now(),
      updatedAt: Date.parse(m.updated_at) || null,
    }));
    this.state.circle.members = members;
    return members;
  }

  async fetchMessages() {
    const c = this.state.circle.code;
    if (!c) return [];
    const r = await this.rpc('get_messages', { p_code: c, p_limit: 200 });
    if (!r.ok) return this.state.circle.messages;
    const messages = (r.data || []).map((m) => ({
      id: m.id,
      playerId: m.player_id,
      displayName: m.display_name,
      newName: m.new_name,
      body: m.body,
      createdAt: Date.parse(m.created_at) || Date.now(),
    }));
    this.state.circle.messages = messages;
    return messages;
  }

  async sendMessage(body, profile) {
    const c = this.state.circle.code;
    if (!c) return { ok: false, error: 'Not in a circle.' };
    const r = await this.rpc('post_message', {
      p_code: c,
      p_player_id: profile.playerId,
      p_display_name: profile.displayName,
      p_body: String(body).slice(0, 2000),
      p_new_name: profile.newName || null,
    });
    if (!r.ok) return { ok: false, error: r.error };
    return { ok: true, id: r.data || null };
  }
}

/** Turn PostgREST noise into something a person can act on. */
function friendlyError(status, text) {
  if (/slow down/i.test(text)) return 'Slow down a moment — too many messages at once.';
  if (/invalid circle code/i.test(text)) return 'That circle code is not valid.';
  if (status === 404) return 'The circle functions are missing. Run supabase/schema.sql in your project.';
  if (status === 401 || status === 403) return 'That key was rejected. Check you used the anon (publishable) key.';
  return `Circle server error (${status}).`;
}

/** Pick the adapter the settings ask for. */
function createAdapter(state) {
  const s = state.settings || {};
  if (s.syncMode === 'supabase' && s.supabaseUrl && s.supabaseKey) {
    return new SupabaseAdapter({ url: s.supabaseUrl, key: s.supabaseKey, state });
  }
  return new LocalAdapter(state);
}

// ── export / import (the offline covenant file) ───────────────────────────

/**
 * A portable save. `includeVault` defaults to FALSE — the private Why is not
 * swept into a file you might hand to someone else by accident. Including it
 * has to be a deliberate act.
 */
function exportSave(state, vault, { includeVault = false } = {}) {
  const payload = {
    kind: 'achieve.save',
    version: state.version,
    exportedAt: new Date().toISOString(),
    state,
    vault: includeVault ? vault : undefined,
    vaultIncluded: Boolean(includeVault),
  };
  return JSON.stringify(payload, null, 2);
}

function parseSave(text) {
  try {
    const parsed = JSON.parse(text);
    if (parsed?.kind !== 'achieve.save' || !parsed.state) {
      return { ok: false, error: 'That file is not an ACHIEVE save.' };
    }
    return { ok: true, state: parsed.state, vault: parsed.vault || null, vaultIncluded: Boolean(parsed.vaultIncluded) };
  } catch (err) {
    return { ok: false, error: 'Could not read that file.' };
  }
}

/** A shareable recap card — public by design, so it is built from stats only. */
function recapPayload(state, summary) {
  return {
    kind: 'achieve.recap',
    player: state.player.newName || state.player.name || 'A runner',
    since: state.player.createdAt,
    generatedAt: Date.now(),
    day: dayKey(),
    stats: summary,
  };
}


/* ─── core/guide.js ─────────────────────────────────────── */

/**
 * guide.js — The Shepherd's lamp.
 *
 * This is what makes ACHIEVE a guidance system rather than a tracker. On
 * every open it reads the whole state, decides WHERE THE PLAYER ACTUALLY IS,
 * and returns exactly one next step, the Word that meets that state, and the
 * mechanism note explaining why this step and not another.
 *
 * A deliberate design constraint: ONE step. Not a list, not a dashboard of
 * competing priorities.
 *
 *   "Thy word is a lamp unto my feet, and a light unto my path." — Ps 119:105
 *
 * A lamp at the feet lights the next step, not the whole road. The game is
 * built to that spec.
 *
 * On the guide's voice: it never speaks AS Christ and never puts words in
 * His mouth. It carries the lamp — it surfaces His actual words and points
 * at the next piece of ground. The Shepherd leads; this is just the light.
 */





/**
 * Read the room.
 * @returns {object} a full situational read used by every other function here
 */
function readState(state, today = dayKey()) {
  const completed = state.quests.filter((q) => q.completedAt);
  const activeDays = [...new Set(completed.map((q) => dayKey(new Date(q.completedAt))))].sort();
  const streak = computeStreak(activeDays, today);
  const sabbath = sabbathState(state.settings, today);

  const recentOutcomes = state.quests
    .filter((q) => q.completedAt || q.failedAt)
    .sort((a, b) => (a.completedAt || a.failedAt) - (b.completedAt || b.failedAt))
    .map((q) => Boolean(q.completedAt));
  const calibration = calibrate(recentOutcomes);

  const doneToday = completed.filter((q) => dayKey(new Date(q.completedAt)) === today).length;
  const lastActive = activeDays[activeDays.length - 1] || null;
  const gap = lastActive ? daysBetween(lastActive, today) : null;

  const openQuests = state.quests.filter((q) => !q.completedAt && !q.archived);
  const veiledStones = state.stones.filter((s) => !s.woopComplete);
  const readyStones = state.stones.filter((s) => s.woopComplete && !s.completedAt);

  return {
    today,
    streak,
    sabbath,
    calibration,
    doneToday,
    lastActive,
    gap,
    activeDays,
    openQuests,
    veiledStones,
    readyStones,
    hasIdentity: state.identities.length > 0,
    hasBoard: state.boards.length > 0 || state.stones.length > 0,
    hasStones: state.stones.length > 0,
    hasCircle: Boolean(state.circle.code),
    totalSteps: completed.length,
    returning: gap !== null && gap >= 2,
  };
}

/**
 * The single next step.
 *
 * The order of these branches IS the game's opinion about what matters. It
 * runs strictly Be → Do → Have: no quests are offered before an identity
 * exists, and no stone is playable before it has been contrasted.
 */
function nextStep(state, read = readState(state)) {
  const seed = hashStr(read.today + state.player.id);

  // 0. The Sabbath outranks everything, including progress. That is the point.
  if (read.sabbath.locked) {
    return {
      kind: 'sabbath',
      title: 'Today the game is closed.',
      body: read.sabbath.message,
      action: null,
      verse: verseFor('sabbath', seed),
      why: principle('sabbath_recovery'),
      tone: 'rest',
    };
  }

  // 1. BE — nothing can be built before a name exists.
  if (!read.hasIdentity) {
    return {
      kind: 'name_identity',
      title: 'Before anything else: who are you becoming?',
      body: 'Not what you want to have. Who you are. The name comes first — that is the order God uses, and it is the order the evidence supports.',
      action: { view: 'identity', label: 'Name it' },
      verse: verseFor('be_teaching', seed),
      why: principle('self_perception'),
      tone: 'foundational',
    };
  }

  // 2. HAVE — the vision has to be written and made plain before it can be run with.
  if (!read.hasStones) {
    return {
      kind: 'write_vision',
      title: 'Write the vision. Make it plain.',
      body: 'Upload your vision board and tap each thing on it, or describe them one at a time. Each becomes a Stone — a memorial you will take ground toward.',
      action: { view: 'vision', label: 'Write it' },
      verse: verseFor('vision_created', seed),
      why: principle('possible_selves'),
      tone: 'foundational',
    };
  }

  // 3. THE WOOP GATE — a stone stays inert until it is contrasted.
  if (read.veiledStones.length && !read.readyStones.length) {
    const stone = read.veiledStones[0];
    return {
      kind: 'woop',
      title: `"${stone.title}" is still veiled.`,
      body: 'A vision you only picture is worse than no vision at all — fantasy alone measurably lowers attainment. Count the cost: name the outcome, the honest inner obstacle, and the if-then plan. Then it kindles.',
      action: { view: 'vision', label: 'Count the cost', stoneId: stone.id },
      verse: verseFor('woop', seed),
      why: principle('mental_contrasting'),
      tone: 'gate',
    };
  }

  // 4. RETURNING after a gap — fresh start framing, never a scolding.
  if (read.returning && read.doneToday === 0) {
    const framing = restorationFraming(read.lastActive, read.today);
    return {
      kind: 'restore',
      title: framing.title,
      body: framing.body,
      action: { view: 'today', label: 'Take one small step' },
      verse: verseFor(framing.ref === 'Isaiah 43:19' ? 'restoration' : 'missed_day', seed),
      why: principle('fresh_start_effect'),
      tone: 'mercy',
      suggestedLevel: framing.suggestedLevel,
    };
  }

  // 5. DO — there is a stone ready but no next action bound to it.
  if (read.readyStones.length && !read.openQuests.length) {
    const stone = read.readyStones[0];
    return {
      kind: 'make_quest',
      title: 'A vision without a next action is a wish.',
      body: `"${stone.title}" is kindled but has no next step. Write one as an if-then — that alone roughly doubles the odds you do it.`,
      action: { view: 'today', label: 'Write the if-then', stoneId: stone.id },
      verse: verseFor('if_then', seed),
      why: principle('implementation_intentions'),
      tone: 'action',
    };
  }

  // 6. The daily rep.
  if (read.openQuests.length) {
    const quest = pickQuest(read.openQuests, state, read);
    const stone = state.stones.find((s) => s.id === quest.stoneId);
    const prog = stone ? stoneProgress(stone, state.quests) : { progress: 0, nearing: false };
    return {
      kind: 'do_quest',
      title: read.doneToday > 0 ? 'One more, if there is one more in you.' : 'One step. This one.',
      body: quest.text,
      quest,
      stone,
      action: { view: 'today', label: 'Begin', questId: quest.id },
      verse: verseFor(prog.nearing ? 'exponential' : 'quest_start', seed),
      why: principle(prog.nearing ? 'goal_gradient' : 'implementation_intentions'),
      tone: prog.nearing ? 'nearing' : 'action',
      nearing: prog.nearing,
    };
  }

  // 7. Everything open is done — consolidate rather than manufacture more work.
  return {
    kind: 'consolidate',
    title: read.doneToday > 0 ? 'Today is accounted for.' : 'Nothing is open.',
    body:
      read.doneToday > 0
        ? 'Do not immediately reach for more. Review the one rep that mattered before you sleep — material reviewed before sleep is preferentially consolidated.'
        : 'Write the next if-then, or sit with the Chronicle and read where you have come from.',
    action: { view: read.doneToday > 0 ? 'chronicle' : 'today', label: read.doneToday > 0 ? 'Evening Altar' : 'Write a step' },
    verse: verseFor(read.doneToday > 0 ? 'evening' : 'planning', seed),
    why: principle(read.doneToday > 0 ? 'sleep_consolidation' : 'implementation_intentions'),
    tone: 'rest',
  };
}

/**
 * Choose which open quest to serve.
 * Goal-gradient first: the stone closest to completion gets priority, because
 * that is where effort accelerates naturally (Kivetz 2006). Ties break toward
 * the identity with the weakest evidence — the self that most needs a vote.
 */
function pickQuest(openQuests, state, read) {
  const scored = openQuests.map((q) => {
    const stone = state.stones.find((s) => s.id === q.stoneId);
    const prog = stone ? stoneProgress(stone, state.quests).progress : 0;
    const tally = q.identityId
      ? tallyIdentity(state.votes, q.identityId, { today: read.today })
      : { rate: 0.5, total: 0 };
    // Nearer the goal is better; weaker evidence is better; sealed is better.
    const score = prog * 2 + (1 - tally.rate) * 0.8 + (q.sealed ? 0.3 : 0);
    return { quest: q, score };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored[0].quest;
}

/**
 * The Word for the step — a verse chosen for today's actual condition,
 * stable across a single day so a person can sit with one thing.
 */
function wordForToday(state, read = readState(state)) {
  const moments = [];
  if (read.sabbath.locked) moments.push('sabbath', 'rest');
  else if (read.returning) moments.push('restoration', 'missed_day');
  else if (read.streak.state === 'graced') moments.push('grace_token', 'missed_day');
  else if (read.streak.current >= 7) moments.push('compounding', 'streak');
  else if (read.doneToday > 0) moments.push('quest_complete', 'small_step');
  else if (!read.hasIdentity) moments.push('onboarding', 'be_teaching');
  else moments.push('daily_open');

  const pool = versesFor(moments);
  const seed = hashStr(read.today + (state.player.id || ''));
  const verse = pool.length ? pool[seed % pool.length] : verseFor('daily_open', seed);
  return { verse, moments };
}

/**
 * The Chronicle note written after an accomplishment.
 * "After each, add some notes of what was accomplished." Nothing completes
 * silently — Amabile & Kramer found noticing progress IS part of its effect.
 */
function accomplishmentNote({ quest, stone, identity, award, tally, read }) {
  const bits = [];
  bits.push(`Completed: ${quest.text}`);
  if (stone) bits.push(`Took ground toward "${stone.title}".`);
  if (award?.manna) bits.push('Manna fell — an unearned surplus on top of the expected reward.');
  if (award?.gradient > 1.2) bits.push(`Goal-gradient bonus ×${award.gradient} — you are close enough that effort is accelerating.`);
  if (read?.streak?.current) bits.push(`${read.streak.current} day${read.streak.current === 1 ? '' : 's'} standing.`);

  const identityLine = identity && tally
    ? evidenceStatement(identity, tally).headline
    : null;

  return {
    kind: 'accomplishment',
    title: identityLine || 'A vote was cast.',
    body: bits.join(' '),
    refs: [
      { ref: 'Hebrews 11:1', why: 'Evidence of things not seen — this is now on the books.' },
      ...(award?.manna ? [{ ref: 'Exodus 16:4', why: 'Daily bread, gathered at a certain rate every day.' }] : []),
    ],
    meta: { questId: quest.id, stoneId: stone?.id || null, identityId: identity?.id || null, xp: award?.xp || 0 },
  };
}

/**
 * The recap: from where they started, to where they are now.
 * Revelation 12:11 — "by the word of their testimony." Rehearsing the road is
 * not nostalgia; it is how a person keeps hold of what is true on a bad day.
 */
function buildRecap(state, read = readState(state)) {
  const completed = state.quests.filter((q) => q.completedAt).sort((a, b) => a.completedAt - b.completedAt);
  const first = completed[0];
  const started = state.player.createdAt;
  const daysIn = Math.max(1, Math.round((Date.now() - started) / 86400000));

  const identityGrowth = state.identities.map((i) => {
    const tally = tallyIdentity(state.votes, i.id, { today: read.today });
    const earliest = state.votes.filter((v) => v.identityId === i.id).sort((a, b) => a.ts - b.ts)[0];
    return {
      identity: i,
      tally,
      firstVoteAt: earliest?.ts || null,
      tier: tally.tier,
    };
  });

  const milestones = [];
  if (started) milestones.push({ ts: started, kind: 'origin', title: 'The vision was written', ref: 'Habakkuk 2:2' });
  for (const i of state.identities) {
    milestones.push({ ts: i.createdAt, kind: 'identity', title: `Named: ${i.statement}`, ref: 'Romans 4:17' });
  }
  if (first) milestones.push({ ts: first.completedAt, kind: 'first_step', title: 'First vote cast', ref: 'Zechariah 4:10' });
  for (const s of state.stones.filter((x) => x.completedAt)) {
    milestones.push({ ts: s.completedAt, kind: 'stone', title: `Took ground: ${s.title}`, ref: 'Matthew 25:21' });
  }
  for (const g of identityGrowth) {
    if (g.tier.key !== 'called') {
      milestones.push({ ts: Date.now(), kind: 'tier', title: `${g.identity.statement} — ${g.tier.name}`, ref: g.tier.ref });
    }
  }
  milestones.sort((a, b) => a.ts - b.ts);

  return {
    started,
    daysIn,
    steps: completed.length,
    stonesTaken: state.stones.filter((s) => s.completedAt).length,
    stonesTotal: state.stones.length,
    longestStreak: read.streak.longest,
    focusMinutes: state.focusBlocks.reduce((a, b) => a + (b.minutes || 0), 0),
    identityGrowth,
    milestones,
    verse: verseFor('recap', hashStr(read.today)),
  };
}

/**

// ── shared fragments ──────────────────────────────────────────────────────

function verseBlock(v, { small = false, note = true } = {}) {
  if (!v) return '';
  return `<blockquote class="verse${small ? ' sm' : ''}">${esc(v.text)}
    <span class="ref">${esc(v.ref)} · KJV</span>
    ${note && v.note ? `<span class="note">${esc(v.note)}</span>` : ''}
  </blockquote>`;
}

function whyBlock(p, label = 'Why this, now') {
  if (!p) return '';
  return `<div class="why">
    <div class="why-head">◈ ${esc(label)}</div>
    <div class="why-body">${esc(p.mechanic)}</div>
    <details class="mt8">
      <summary>The study</summary>

      <span class="why-cite">${esc(p.source)}</span>

}

function domainPill(key) {
  const d = domain(key);
  return `<span class="pill" style="border-color:hsl(${d.hue} 40% 32%);color:hsl(${d.hue} 55% 68%)">${esc(d.name)}</span>`;

function initials(name) {
  return String(name || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();

        <div class="why-body">Godden &amp; Baddeley (1975): divers who learned word lists underwater recalled them far better underwater. Physical context becomes part of the memory trace — so the same act in the same place builds automaticity faster than the same act scattered around. Binding a step to real ground is a real mechanic, not a decoration.</div>
      </div>
      <div class="canvas-wrap mt16"><canvas id="earth-canvas" width="900" height="560"></canvas></div>
      <div class="map-legend">
        <span><i style="background:var(--gold)"></i>Ebenezer — hitherto hath the LORD helped us</span>
        <span><i style="background:var(--water)"></i>Bound step</span>
      </div>

        <div class="row">

}

function growthView(ctx) {
  const { growth, explain } = ctx;
  const y = Math.round(growth.yield * 100);
  return `

    <div class="card-head"><h2>Linear and exponential, at once</h2></div>
    <div class="chart-wrap"><canvas id="growth-canvas" width="900" height="420"></canvas></div>
    <div class="chart-legend">
      <span><i style="background:#8b8f9e"></i>Steps — one act, one step</span>
      <span><i style="background:var(--gold)"></i>Increase — what compounding added</span>
    </div>
    <div class="grid three mt16">
      <div class="stat"><div class="n">${growth.steps}</div><div class="l">Steps</div></div>
      <div class="stat"><div class="n">${growth.increase}</div><div class="l">Increase</div></div>
      <div class="stat"><div class="n">${y > 0 ? '+' + y + '%' : '0%'}</div><div class="l">${esc(growth.tier.label)}</div></div>
    </div>
    ${verseBlock(SCRIPTURE.find((v) => v.ref === 'Mark 4:8'))}
  </div>

  <div class="card">
    <div class="card-head"><h3>Where your rate comes from</h3><span class="spacer"></span><span class="pill gold">${explain.ratePct}% / day</span></div>
    <p class="small mut">If this rate is zero the two lines sit exactly on top of each other — and they should. There is no exponential without consistency, and the chart will not pretend otherwise.</p>
    ${explain.parts.map((p) => `
      <div style="margin-bottom:12px">
        <div class="row" style="border:0;padding:0 0 4px">
          <div class="grow"><b class="small">${esc(p.label)}</b></div>
          <span class="tiny mut">+${p.contribution}%/day</span>
        </div>
        <div class="bar thin"><i style="width:${pct(p.value)}%"></i></div>
        <div class="tiny mut mt8">${esc(p.why)}</div>
      </div>`).join('')}
    <div class="ok-msg mt16">Weakest link right now: <b>${esc(explain.weakest.label)}</b>. That is the lever with the most left in it.</div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Why two lines at all</h3></div>
    <p class="small mut">Raw reps flatten — the power law of practice guarantees diminishing returns per rep (Newell &amp; Rosenbloom 1981). So the second line cannot come from grinding harder. It comes from <b>consistency compounding</b> and from the <b>Covenant Circle</b>, which is the only input that grows without you spending more hours. That is why the circle is in the maths and not just in the app.</p>
    ${verseBlock(SCRIPTURE.find((v) => v.ref === 'Ephesians 3:20'), { small: true })}
  </div>`;
}

function focusModal(quest) {
  return `
  <div class="eyebrow">The Upper Room</div>
  <h2>Focus</h2>
  <p class="small mut">${esc(quest?.text || 'Attend to one thing.')}</p>
  ${verseBlock(SCRIPTURE.find((v) => v.ref === 'Romans 12:2'), { small: true })}
  <div class="why">
    <div class="why-head">◈ Why the timer, and why the stillness after</div>
    <div class="why-body">Cortical remapping happens only for what the brain <b>attends to</b> — identical unattended input produces no change (Recanzone &amp; Merzenich 1993). Then, immediately after practice, quiet rest produces compressed replay of the sequence at ~20× speed, and the amount of replay predicts later performance (Foster &amp; Wilson 2006). The stillness is not a break from the work. It is part of it.</div>
  </div>
  <div class="btn-row" style="justify-content:center">
    ${FOCUS_PRESETS.map((p) => `<button class="btn" data-act="focus-start" data-min="${p.minutes}" data-rest="${p.rest}" data-quest="${esc(quest?.id || '')}" data-testid="focus-${p.minutes}">
      ${p.minutes}m · ${esc(p.name)}</button>`).join('')}
  </div>
  <p class="tiny mut center mt16">Then ${FOCUS_PRESETS.map((p) => p.rest).join('/')} minutes of stillness. Skipping it forfeits part of the credit.</p>`;
}

function runningFocusModal(st) {
  const total = st.resting ? st.restSeconds : st.workSeconds;
  const left = st.remaining;
  const frac = total > 0 ? 1 - left / total : 0;
  const R = 74, C = 2 * Math.PI * R;
  const mm = String(Math.floor(left / 60)).padStart(2, '0');
  const ss = String(left % 60).padStart(2, '0');
  return `
  <div class="timer ${st.resting ? 'resting' : ''}">
    <div class="ring">
      <svg width="168" height="168">
        <circle cx="84" cy="84" r="${R}" fill="none" stroke="#232838" stroke-width="8"></circle>
        <circle cx="84" cy="84" r="${R}" fill="none" stroke="${st.resting ? '#5b8fb0' : '#e0b054'}" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"></circle>
      </svg>
      <div class="ring-mid"><div class="clock" data-testid="focus-clock">${mm}:${ss}</div></div>
    </div>
    <div class="phase">${st.resting ? 'Be still, and know' : 'Attend to one thing'}</div>
    ${st.resting ? verseBlock(SCRIPTURE.find((v) => v.ref === 'Psalm 46:10'), { small: true, note: false }) : ''}
    <div class="btn-row mt16" style="justify-content:center">
      ${st.resting
        ? `<button class="btn primary" data-act="focus-finish" data-testid="focus-finish">Finish</button>`
        : `<button class="btn primary" data-act="focus-torest" data-testid="focus-torest">Enter the stillness</button>`}
      <button class="btn ghost" data-act="focus-abandon">Stop</button>
    </div>
  </div>`;
}

function onboardingView(ctx) {

// ── app singleton ─────────────────────────────────────────────────────────

const App = {

  members: [],
  messages: [],
  toasts: [],
  pendingQuest: null,
  whyGate: null,
  whyGateTimer: null,
};

globalThis.__ACHIEVE = App; // test hook

// ── boot ──────────────────────────────────────────────────────────────────

function boot() {
  App.state = migrate(loadState());
  App.vault = loadVault() || emptyVault();
  App.adapter = createAdapter(App.state);

  // Manna spoils if it is hoarded. Exodus 16:20.
  const decayed = decayManna(App.state.manna, dayKey());
  if (decayed.spoiledCount > 0) {
    App.state.manna = decayed.kept;
    chronicle(App.state, {
      kind: 'manna_spoiled',
      title: `${decayed.spoiledCount} manna spoiled`,
      body: 'Gathered but never spent. What was kept overnight bred worms — the daily portion is meant to be used.',
      refs: [{ ref: 'Exodus 16:20', why: 'Hoarded provision rots.' }],
    });
  }

  App.state.meta.lastOpen = Date.now();
  persist();
  render();
  refreshCircle();
  startChatPolling();
}

function persist() {
  const r = saveState(App.state);
  if (!r.ok) toast(r.error || 'Could not save.', 'bad');
}

function persistVault() {
  const r = saveVault(App.vault);
  if (!r.ok) toast(r.error || 'Could not save the vault.', 'bad');
}

// ── derived context ───────────────────────────────────────────────────────

function context() {
  const state = App.state;
  const read = readState(state);
  const step = nextStep(state, read);
  const word = wordForToday(state, read);

  const tallies = {};
  for (const i of state.identities) {
    tallies[i.id] = tallyIdentity(state.votes, i.id, { today: read.today });
  }

  const completions = state.quests
    .filter((q) => q.completedAt)
    .map((q) => {
      const t = tallies[q.identityId];
      return { day: dayKey(new Date(q.completedAt)), identityId: q.identityId, aligned: true };
    });

  const from = completions.length
    ? completions.map((c) => c.day).sort()[0]
    : dayKey(new Date(state.player.createdAt));
  const partners = Math.max(0, App.members.length - 1);
  const series = buildSeries({
    completions,
    from,
    to: read.today,
    activePartnersOn: () => partners,
  });
  const growth = runGrowth(series);
  const explain = explainRate(displayTerms(series));

  const territories = {};
  for (const d of DOMAINS) {
    const stones = state.stones.filter((s) => s.domain === d.key);
    territories[d.key] = {
      total: stones.length,
      done: stones.filter((s) => s.completedAt).length,
      kindled: stones.filter((s) => s.woopComplete).length,
      stones,
    };
  }

  return {
    state, read, step, word, tallies, growth, explain, territories,
    mapTab: App.mapTab,
    picking: App.picking,
    syncStatus: App.syncStatus,
    members: App.members,
    messages: App.messages,
    me: profile(),
    recap: buildRecap(state, read),
    stoneProgressOf: (s) => stoneProgress(s, state.quests),
    hasWhy: (id) => Boolean(getWhy(App.vault, id)),
  };
}

function profile() {
  return {
    playerId: App.state.player.id,
    displayName: App.state.settings.displayName || App.state.player.name || 'A runner',
    newName: App.state.player.newName || '',
    snapshot: shareable(App.state),
  };
}

// ── canvas plumbing ───────────────────────────────────────────────────────

/**
 * Size the backing store to the element's real display width × DPR, and
 * scale the context so drawing code works in CSS pixels.
 *
 * Without this, a fixed 900px canvas squashed into a 430px phone renders
 * 10px labels at about 5px — technically drawn, practically unreadable.
 */
function fitCanvas(cv, aspect) {
  const cssW = cv.clientWidth || cv.parentElement?.clientWidth || 900;
  const cssH = Math.round(cssW / aspect);
  const dpr = Math.min(2, globalThis.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.height = `${cssH}px`;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, W: cssW, H: cssH };
}

// ── canvas: the Promised Land ─────────────────────────────────────────────

function drawLand(ctx) {
  const cv = document.getElementById('land-canvas');
  if (!cv) return;
  const { g, W, H } = fitCanvas(cv, 900 / 560);
  g.clearRect(0, 0, W, H);

  // ground
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0a0c13');
  grd.addColorStop(1, '#0e1119');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);

  const cols = 3, rows = 2;
  const pad = Math.max(10, W * 0.029);
  // Type scales with the real drawing width so it stays legible on a phone.
  const fs = clamp(W / 32, 10, 15);
  const cw = (W - pad * 2) / cols;
  const ch = (H - pad * 2) / rows;

  DOMAINS.forEach((d, i) => {
    const cx = pad + (i % cols) * cw + cw / 2;
    const cy = pad + Math.floor(i / cols) * ch + ch / 2;
    const t = ctx.territories[d.key];
    const frac = t.total ? t.done / t.total : 0;
    const kindled = t.total ? t.kindled / t.total : 0;

    const R = Math.min(cw, ch) * 0.42;
    // fog of war — unclaimed ground stays dark
    g.beginPath();
    hexPath(g, cx, cy, R);
    g.fillStyle = t.total === 0
      ? 'rgba(30,34,48,.5)'
      : `hsla(${d.hue}, ${18 + kindled * 30}%, ${8 + frac * 22}%, ${.55 + frac * .45})`;
    g.fill();
    g.strokeStyle = t.total === 0 ? '#232838' : `hsla(${d.hue}, 45%, ${28 + frac * 32}%, .9)`;
    g.lineWidth = 2;
    g.stroke();

    // taken portion as an inner hex
    if (frac > 0) {
      g.beginPath();
      hexPath(g, cx, cy, R * (0.28 + frac * 0.62));
      g.fillStyle = `hsla(${d.hue}, 62%, 52%, .30)`;
      g.fill();
      g.strokeStyle = `hsla(${d.hue}, 70%, 62%, .8)`;
      g.lineWidth = 1.5;
      g.stroke();
    }

    g.fillStyle = t.total === 0 ? '#5a5d70' : '#e8e6e0';
    g.font = `600 ${fs}px ui-sans-serif, system-ui, sans-serif`;
    g.textAlign = 'center';
    g.fillText(d.name, cx, cy - 2);

    g.fillStyle = t.total === 0 ? '#43465a' : `hsl(${d.hue}, 55%, 68%)`;
    g.font = `${fs * 0.82}px ui-sans-serif, system-ui, sans-serif`;
    g.fillText(t.total ? `${t.done}/${t.total} taken` : 'unclaimed', cx, cy + fs + 2);
  });

  g.fillStyle = '#6f7284';
  g.font = `italic ${clamp(W / 62, 9, 13)}px Georgia, serif`;
  g.textAlign = 'center';
  g.fillText(W < 520
    ? '“…that have I given unto you.” — Joshua 1:3'
    : '“Every place that the sole of your foot shall tread upon, that have I given unto you.”  — Joshua 1:3', W / 2, H - 8);
}

function hexPath(g, cx, cy, r) {
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i - Math.PI / 2;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
}

// ── canvas: real ground ───────────────────────────────────────────────────

function drawEarth(ctx) {
  const cv = document.getElementById('earth-canvas');
  if (!cv) return;
  const { g, W, H } = fitCanvas(cv, 900 / 560);
  g.fillStyle = '#080a10';
  g.fillRect(0, 0, W, H);

  const pings = ctx.state.pings;
  if (!pings.length) {
    g.fillStyle = '#4a4d60';
    g.font = `${clamp(W / 32, 12, 15)}px ui-sans-serif, system-ui, sans-serif`;
    g.textAlign = 'center';
    g.fillText('No ground marked yet.', W / 2, H / 2 - 8);
    g.font = `italic ${clamp(W / 40, 10, 13)}px Georgia, serif`;
    g.fillText('“Hitherto hath the LORD helped us.” — 1 Samuel 7:12', W / 2, H / 2 + 18);
    return;
  }

  // Equirectangular projection about the centroid — a real map of real
  // coordinates that needs no tile server and works offline.
  const lats = pings.map((p) => p.lat);
  const lngs = pings.map((p) => p.lng);
  const cLat = (Math.min(...lats) + Math.max(...lats)) / 2;
  const cLng = (Math.min(...lngs) + Math.max(...lngs)) / 2;
  const kx = Math.cos((cLat * Math.PI) / 180);

  let spanLat = Math.max(...lats) - Math.min(...lats);
  let spanLng = (Math.max(...lngs) - Math.min(...lngs)) * kx;
  const span = Math.max(spanLat, spanLng, 0.004) * 1.5;
  const scale = Math.min(W, H) / span * 0.82;

  const proj = (p) => ({
    x: W / 2 + (p.lng - cLng) * kx * scale,
    y: H / 2 - (p.lat - cLat) * scale,
  });

  // distance rings
  const kmPerDeg = 111.32;
  g.strokeStyle = '#1a1e2b';
  g.lineWidth = 1;
  for (const km of [0.5, 1, 2, 5, 10, 25]) {
    const r = (km / kmPerDeg) * scale;
    if (r < 14 || r > Math.max(W, H)) continue;
    g.beginPath();
    g.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = '#2c3244';
    g.font = '10px ui-monospace, monospace';
    g.textAlign = 'left';
    g.fillText(`${km}km`, W / 2 + r + 4, H / 2 - 3);
  }

  // crosshair
  g.strokeStyle = '#161a26';
  g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2);
  g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();

  // compass
  g.fillStyle = '#3a3e52';
  g.font = '600 12px ui-sans-serif, sans-serif';
  g.textAlign = 'center';
  g.fillText('N', W / 2, 16);

  // trail between pings, oldest to newest
  const ordered = pings.slice().sort((a, b) => a.ts - b.ts);
  g.strokeStyle = 'rgba(224,176,84,.22)';
  g.lineWidth = 1.5;
  g.setLineDash([4, 5]);
  g.beginPath();
  ordered.forEach((p, i) => {
    const { x, y } = proj(p);
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  });
  g.stroke();
  g.setLineDash([]);

  ordered.forEach((p, i) => {
    const { x, y } = proj(p);
    const isLast = i === ordered.length - 1;
    const color = p.kind === 'quest' ? '#5b8fb0' : '#e0b054';

    if (isLast) {
      g.beginPath();
      g.arc(x, y, 15, 0, Math.PI * 2);
      g.fillStyle = 'rgba(224,176,84,.14)';
      g.fill();
    }
    g.beginPath();
    g.arc(x, y, 6, 0, Math.PI * 2);
    g.fillStyle = color;
    g.fill();
    g.strokeStyle = '#080a10';
    g.lineWidth = 2;
    g.stroke();

    g.fillStyle = '#c9cbd6';
    g.font = `${clamp(W / 40, 10, 13)}px ui-sans-serif, system-ui, sans-serif`;
    g.textAlign = 'center';
    const label = p.label || 'Ebenezer';
    g.fillText(label.length > 22 ? label.slice(0, 21) + '…' : label, x, y - 12);
  });

  g.fillStyle = '#6f7284';
  g.font = `italic ${clamp(W / 60, 9, 12)}px Georgia, serif`;
  g.textAlign = 'center';
  g.fillText(W < 520
    ? '“…called the name of it Ebenezer.” — 1 Samuel 7:12'
    : '“Then Samuel took a stone… and called the name of it Ebenezer.” — 1 Samuel 7:12', W / 2, H - 8);
}

// ── canvas: the two lines ─────────────────────────────────────────────────

function drawGrowth(ctx) {
  const cv = document.getElementById('growth-canvas');
  if (!cv) return;
  const { g, W, H } = fitCanvas(cv, 900 / 420);
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#0a0c13';
  g.fillRect(0, 0, W, H);

  const pts = ctx.growth.points;
  const fs = clamp(W / 45, 9, 12);
  const pad = { l: clamp(W * 0.1, 30, 46), r: 14, t: 16, b: fs * 2.4 };
  const iw = W - pad.l - pad.r;
  const ih = H - pad.t - pad.b;

  if (pts.length < 2) {
    g.fillStyle = '#4a4d60';
    g.font = `${clamp(W / 32, 12, 15)}px ui-sans-serif, system-ui, sans-serif`;
    g.textAlign = 'center';
    g.fillText('Two days of steps and the lines appear.', W / 2, H / 2);
    return;
  }

  const maxY = Math.max(1, ...pts.map((p) => Math.max(p.linear, p.increase))) * 1.08;
  const X = (i) => pad.l + (i / (pts.length - 1)) * iw;
  const Y = (v) => pad.t + ih - (v / maxY) * ih;

  // grid
  g.strokeStyle = '#171b26';
  g.lineWidth = 1;
  g.fillStyle = '#4a4d60';
  g.font = `${fs}px ui-monospace, monospace`;
  g.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const v = (maxY / 4) * i;
    const y = Y(v);
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke();
    g.fillText(Math.round(v), pad.l - 6, y + 3);
  }

  // the gap — this IS the yield, so it gets painted
  g.beginPath();
  pts.forEach((p, i) => { const x = X(i); i === 0 ? g.moveTo(x, Y(p.increase)) : g.lineTo(x, Y(p.increase)); });
  for (let i = pts.length - 1; i >= 0; i--) g.lineTo(X(i), Y(pts[i].linear));
  g.closePath();
  const fill = g.createLinearGradient(0, pad.t, 0, H);
  fill.addColorStop(0, 'rgba(224,176,84,.22)');
  fill.addColorStop(1, 'rgba(224,176,84,.02)');
  g.fillStyle = fill;
  g.fill();

  // linear
  g.beginPath();
  pts.forEach((p, i) => { const x = X(i); i === 0 ? g.moveTo(x, Y(p.linear)) : g.lineTo(x, Y(p.linear)); });
  g.strokeStyle = '#8b8f9e';
  g.lineWidth = 2;
  g.stroke();

  // increase
  g.beginPath();
  pts.forEach((p, i) => { const x = X(i); i === 0 ? g.moveTo(x, Y(p.increase)) : g.lineTo(x, Y(p.increase)); });
  g.strokeStyle = '#e0b054';
  g.lineWidth = 2.5;
  g.stroke();

  // endpoint
  const last = pts[pts.length - 1];
  g.beginPath();
  g.arc(X(pts.length - 1), Y(last.increase), 4.5, 0, Math.PI * 2);
  g.fillStyle = '#e0b054'; g.fill();

  g.fillStyle = '#4a4d60';
  g.font = `${fs}px ui-monospace, monospace`;
  g.textAlign = 'left';
  g.fillText(pts[0].day, pad.l, H - fs * 0.6);
  g.textAlign = 'right';
  g.fillText(last.day, W - pad.r, H - fs * 0.6);

  if (Math.abs(last.increase - last.linear) < 0.01) {
    g.fillStyle = '#8b8f9e';
    g.font = `italic ${clamp(W / 40, 10, 13)}px Georgia, serif`;
    g.textAlign = 'center';
    g.fillText('One line. Consistency is what separates them.', W / 2, pad.t + 14);
  }
}

// ── actions ───────────────────────────────────────────────────────────────

const actions = {
  nav(el) {
    App.view = el.dataset.view;
    App.picking = false;
    render();
    if (App.view === 'circle') refreshCircle();
  },

  'step-action'(el) {
    const { view, questId, stoneId } = el.dataset;
    if (questId) return actions['quest-done'](el);
    if (stoneId) {
      App.view = view; render();
      const stone = App.state.stones.find((s) => s.id === stoneId);
      if (stone) openModal(V.woopModal(stone, context()));
      return;
    }
    if (view === 'today' && el.textContent.includes('if-then')) {
      App.view = 'today'; render();
      return openModal(V.questModal(context(), {}));
    }
    App.view = view;
    render();
  },

  'onboard-go'() {
    const name = (document.getElementById('ob-name')?.value || '').trim();
    App.state.player.name = name;
    App.state.settings.displayName = name;
    App.state.meta.onboarded = true;
    chronicle(App.state, {
      kind: 'origin',
      title: 'The vision was opened',
      body: `${name || 'A runner'} began. Nothing has been proved yet — and that is exactly where Gideon was standing when he was called a mighty man of valour.`,
      refs: [{ ref: 'Habakkuk 2:2', why: 'Write the vision, and make it plain.' }],
    });
    persist();
    App.view = 'identity';
    render();
    toast('Begin with who you are becoming.', 'gold');
  },

  // ── identity ──
